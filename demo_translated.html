<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#1f2329; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent2:#dc2626; --hl:#fff7e6; --hl-bd:#f5c542;
    --chip:#eef2ff; --chip-on:#2563eb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#1a1d23; --text:#e6e8eb; --muted:#9aa3ad;
      --line:#2a2f37; --accent:#60a5fa; --accent2:#f87171; --hl:#2a2410; --hl-bd:#a87f1a;
      --chip:#1e2530; --chip-on:#3b82f6; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);line-height:1.6}
  header{padding:24px 20px 8px;max-width:980px;margin:0 auto}
  h1{margin:0 0 4px;font-size:24px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:6px}
  .tstatus{font-size:13px;margin-bottom:14px;padding:8px 12px;border-radius:10px}
  .tstatus.on{background:rgba(22,163,74,.12);color:#16a34a;border:1px solid rgba(22,163,74,.3)}
  .tstatus.off{background:rgba(217,119,6,.1);color:#d97706;border:1px solid rgba(217,119,6,.3)}
  .controls{max-width:980px;margin:0 auto;padding:0 20px 12px;position:sticky;top:0;background:var(--bg);z-index:10;padding-top:10px}
  .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:14px}
  .opt{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--muted)}
  .opt input{accent-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--chip);color:var(--text);
        font-size:13px;cursor:pointer;user-select:none;transition:.15s}
  .chip.active{background:var(--chip-on);color:#fff;border-color:var(--chip-on)}
  .chip .n{opacity:.7;font-size:12px;margin-left:4px}
  main{max-width:980px;margin:0 auto;padding:8px 20px 60px}
  .journal-h{margin:26px 0 12px;font-size:19px;border-left:4px solid var(--accent);padding-left:10px}
  .journal-h .cnt{color:var(--muted);font-size:14px;font-weight:400;margin-left:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;
        box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
  .badge{background:var(--chip);padding:2px 8px;border-radius:6px}
  .badge.date{background:transparent;border:1px solid var(--line)}
  .title-en{font-size:16px;font-weight:600;margin:2px 0}
  .title-zh{font-size:15px;color:var(--text);margin:2px 0 8px}
  .title-zh::before{content:"中译 ";color:var(--accent);font-size:12px;font-weight:600;margin-right:4px}
  .hl{display:inline-block;margin:6px 0 10px;padding:6px 10px;border-radius:8px;background:var(--hl);
      border:1px solid var(--hl-bd);font-size:13.5px}
  .hl b{color:var(--accent2)}
  details{margin:6px 0;border-top:1px dashed var(--line);padding-top:8px}
  summary{cursor:pointer;color:var(--accent);font-size:13px;outline:none}
  .abs-block{margin:10px 0 0;border-top:1px dashed var(--line);padding-top:10px}
  .ab{font-size:13.5px;margin:8px 0 0;color:var(--text)}
  .ab .lbl{color:var(--muted);font-size:12px;display:block;margin-bottom:2px}
  .ab.noabs{color:var(--muted);font-style:italic;font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);
       color:var(--accent);cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--chip)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  footer{max-width:980px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12px}
  .ok{color:#16a34a}.warn{color:#d97706}
</style>
</head>

const META = {"generated_at": "2026-10-21 19:56", "weeks_back": 1, "journals": ["Nature Immunology", "Nature", "Science", "Cell", "JAAD", "JID"], "translation": "enabled"};
const PAPERS = [{"title": "A distinct serological signature of preterm birth", "title_zh": "早产具有独特的血清学特征", "journal": "Nature Immunology", "date": "2026-10-19", "type": "Article", "doi": "10.1038/s41590-026-02691-4", "url": "https://www.nature.com/articles/s41590-026-02691-4", "abstract": "Preterm birth is the leading cause of death in children globally. We determined proteome-wide autoantibody profiles for 2,195 pregnant individuals, revealing a shared humoral program of normal pregnancy and a distinct, expanded autoreactive signature that precedes preterm birth.", "abstract_zh": "早产是全球儿童死亡的首要原因。我们测定了2,195名孕妇的全蛋白质组自身抗体谱，揭示了正常妊娠共有的体液免疫程序，以及在早产发生前即已出现的独特且扩增的自身反应特征。", "summary_zh": "通过对两千余名孕妇的自身抗体谱分析，发现早产前即存在的特异性扩增自身反应信号，具备预警价值。", "highlight": "在大型孕妇队列中发现早产前特异性的自身抗体扩增特征，为早产预测提供了血清学依据。"}, {"title": "The bidirectional double burden of non-communicable diseases and infections", "title_zh": "非传染性疾病与感染的双向双重负担", "journal": "Nature Immunology", "date": "2026-10-19", "type": "Article", "doi": "10.1038/s41590-026-02696-z", "url": "https://www.nature.com/articles/s41590-026-02696-z", "abstract": "The alarming rise in NCDs, particularly in low- and middle-income countries, is closely linked to infectious diseases. Despite growing evidence of a bidirectional, mutually reinforcing relationship, these links have received insufficient attention from researchers and healthcare stakeholders.", "abstract_zh": "非传染性疾病（NCD）的急剧上升——尤其在低收入和中等收入国家——与感染性疾病密切相关。尽管二者存在双向、相互强化的关系的证据日益增多，但这些关联尚未得到研究人员与医疗决策者的足够重视。", "summary_zh": "评述NCD与感染之间被忽视的双向互促关系，呼吁在研究与卫生政策层面给予更多关注。", "highlight": "系统阐述NCD与感染的双向双重负担，强调二者相互强化却长期被卫生体系忽视。"}, {"title": "A tolerogenic function for gut T FH cells", "title_zh": "肠道滤泡辅助性T细胞具有耐受原功能", "journal": "Nature Immunology", "date": "2026-10-21", "type": "Article", "doi": "10.1038/s41590-026-02693-2", "url": "https://www.nature.com/articles/s41590-026-02693-2", "abstract": "Regulatory T (Treg) cells maintain immunological tolerance, but the cellular niches sustaining them across tissues are poorly defined. Work now identifies T follicular helper cells as a source of IL-2 that supports Treg cells in gut-associated lymphoid tissue and promotes intestinal immune homeostasis.", "abstract_zh": "调节性T细胞（Treg）维持免疫耐受，但支持其在各组织中存活的细胞微环境尚不明确。本研究鉴定出滤泡辅助性T细胞（Tfh）是IL-2的来源，可在肠道相关淋巴组织中支持Treg细胞并促进肠道免疫稳态。", "summary_zh": "肠道Tfh细胞通过分泌IL-2来支持Treg，揭示了一条维持肠道免疫耐受的具体细胞通路。", "highlight": "首次将滤泡辅助性T细胞鉴定为肠道Treg细胞的IL-2来源，为肠道免疫稳态提供了新机制。"}, {"title": "A single-cell atlas of human neutrophils reveals neutrophil heterogeneity across health and disease", "title_zh": "人类中性粒细胞单细胞图谱揭示健康与疾病中的异质性", "journal": "Nature Immunology", "date": "2026-10-21", "type": "Article", "doi": "10.1038/s41590-026-02671-8", "url": "https://www.nature.com/articles/s41590-026-02671-8", "abstract": "Khatri and colleagues assembled a single-cell atlas of 1 million human neutrophils based on the integration of 43 independent single-cell transcriptome datasets to define multiple neutrophil subsets with distinct functions across tissues and disease states.", "abstract_zh": "Khatri及其同事整合43个独立的单细胞转录组数据集，构建了包含100万个人类中性粒细胞的单细胞图谱，据此定义了在多种组织和疾病状态下具有不同功能的多个中性粒细胞亚群。", "summary_zh": "通过整合百万级中性粒细胞单细胞数据，建立了跨组织与疾病状态的中性粒细胞亚群分类框架。", "highlight": "构建了迄今最大规模的人类中性粒细胞单细胞图谱，系统定义了功能各异的中性粒细胞亚群。"}, {"title": "IL-2-producing T FH cells sustain T reg cell homeostasis and immune tolerance in the gut", "title_zh": "分泌IL-2的Tfh细胞维持肠道Treg稳态与免疫耐受", "journal": "Nature Immunology", "date": "2026-10-21", "type": "Article", "doi": "10.1038/s41590-026-02690-5", "url": "https://www.nature.com/articles/s41590-026-02690-5", "abstract": "Ballesteros-Tato and colleagues identify a spatially restricted follicular helper T cell-dependent interleukin-2 niche critical for regulatory T cell stability in gut-associated lymphoid tissues.", "abstract_zh": "Ballesteros-Tato及其同事鉴定出一个空间受限的、依赖滤泡辅助性T细胞的IL-2微环境，该微环境对肠道相关淋巴组织中调节性T细胞的稳定性至关重要。", "summary_zh": "发现肠道中由Tfh细胞限域提供的IL-2微环境是Treg稳定的关键，从空间维度解释了肠道免疫耐受的维持。", "highlight": "揭示了一个空间受限的Tfh依赖型IL-2生态位，为理解肠道Treg稳定与免疫耐受提供了关键线索。"}, {"title": "Spatial confinement promotes germinal center diversity and tempers immunodominance", "title_zh": "空间限制促进生发中心多样性并抑制免疫优势", "journal": "Nature Immunology", "date": "2026-10-21", "type": "Article", "doi": "10.1038/s41590-026-02698-x", "url": "https://www.nature.com/articles/s41590-026-02698-x", "abstract": "Chen et al. examine why germinal centers (GCs) are confined to isolated islands in reactive lymph nodes during an immune response. They find that spatial confinement of GC B cells leads to greater antibody diversity by limiting the exchange and expansion of dominant B cell clones.", "abstract_zh": "Chen等人探讨了为何在免疫应答期间生发中心（GC）会被限制在反应性淋巴结中的孤立“岛屿”内。他们发现，GC B细胞的空间限制通过限制优势B细胞克隆的交换与扩增，从而提高了抗体多样性。", "summary_zh": "生发中心的空间隔离限制了优势克隆扩张，从而提升抗体多样性、削弱免疫优势。", "highlight": "发现空间限制是生发中心产生抗体多样性的物理机制，解释了免疫应答中克隆竞争的调控。"}, {"title": "Nearly half of reef-building corals face elevated relative risk of extinction", "title_zh": "近半数造礁珊瑚面临升高的相对灭绝风险", "journal": "Nature", "date": "2026-10-15", "type": "Article", "doi": "10.1038/s41586-026-11263-3", "url": "https://www.nature.com/articles/s41586-026-11263-3", "abstract": "Coral reefs are diverse marine ecosystems that provide ecological functions and economic and social benefits across over 100 tropical countries. Warming driven by climate change is a primary threat to coral reefs and is increasing the frequency of global coral bleaching events. Here we reassessed the IUCN Red List status of 892 reef-building coral species, first assessed in 2008 1. Because species-level population trends are unavailable for most reef-building corals, population reductions were inferred using proxies based on global coral cover trends and projected annual severe bleaching under SSP2-4.5, both over three decades, adjusted using trait-based estimates of species vulnerability. Of the 774 species with sufficient data to be assessed, 340 (44%) were classified as threatened under IUCN Red List criteria. Thirty-three species were assessed as Critically Endangered, 251 as Endangered, and 56 as Vulnerable, most due to risk of population reduction associated with projected thermal stress. These findings predate the three hottest years on record and the fourth global coral bleaching event (2023-2025), and the first exceedance for an annual mean of the 1.5oC global warming threshold. The findings reinforce the importance of limiting further warming to maintain coral biodiversity and reef ecosystem function. The Red List assesses the relative extinction risk of species, whereby species are placed in categories of increasing risk by comparing their population size, decline and geographic range against standardised thresholds. The Red List does not predict whether or when a species may go extinct. As the ranges of coral species remain under-surveyed, future assessments would be strengthened by species-level population data and thermal-stress and recovery metrics that better capture range-representative dynamics.", "abstract_zh": "珊瑚礁是多样的海洋生态系统，在100多个热带国家提供生态功能及经济与社会效益。气候变化驱动的变暖是珊瑚礁的主要威胁，并提高了全球珊瑚白化事件的频率。在此，我们重新评估了892种造礁珊瑚的IUCN红色名录 status（首次评估于2008年）。由于大多数造礁珊瑚缺乏物种层面的种群趋势数据，我们利用基于全球珊瑚覆盖趋势和SSP2-4.5情景下预测的年度重度白化的替代指标（均跨越三十年），并结合基于性状的物种脆弱性估计进行校正，来推断种群减少程度。在774个数据充足的评估物种中，340种（44%）依据IUCN红色名录标准被列为受威胁。其中33种为极危、251种为濒危、56种为易危，多数由于与预测热胁迫相关的种群减少风险。这些发现早于有记录以来最热的三年以及第四次全球珊瑚白化事件（2023–2025）和1.5°C全球变暖阈值的年均值首次被突破。结果强调了限制进一步变暖以维持珊瑚生物多样性与礁生态系统功能的重要性。红色名录评估的是物种的相对灭绝风险，即通过比较种群规模、下降幅度和地理分布范围与标准化阈值，将物种归入风险递增的类别；它并不预测物种是否会或何时会灭绝。由于珊瑚物种的分布范围仍调查不足，未来的评估若能纳入物种层面的种群数据以及能更好捕捉代表性范围动态的热胁迫与恢复指标，将更为有力。", "summary_zh": "重新评估892种造礁珊瑚的IUCN红色名录，发现44%（340种）受威胁，多为热胁迫导致的种群减少风险。结果早于近年最热年份与第四次全球白化事件，凸显将升温控制在1.5°C以内的紧迫性。", "highlight": "重新评估显示近半数造礁珊瑚受威胁，为全球珊瑚礁保护目标提供了最新量化依据。", "pmid": "42880730"}, {"title": "Cortex-wide imaging in naturally behaving mice with 1-gram wireless mesoscopes", "title_zh": "用1克重无线介观显微镜对自然行为小鼠进行全皮层成像", "journal": "Nature", "date": "2026-10-19", "type": "Article", "doi": "10.1038/s41586-026-11293-x", "url": "https://www.nature.com/articles/s41586-026-11293-x", "abstract": "Revealing how distributed cortical circuits coordinate behavior in freely moving animals remains a central challenge in systems neuroscience, constrained by limited fields of view, low throughput, and the tethering required by current miniaturized microscopes1-4. Here, we present Airscope, a wireless mesoscope delivering 4 &#x3bc;m lateral resolution across a 6 mm field of view at 12.5 Hz, weighing 1.0 gram. An aspheric-lens design achieves a 2.84&#xd7; shorter total track length than previous miniaturized microscopes1,2,5,6 while matching the neuron yield of benchtop one-photon mesoscopes; a tailored wireless link supports cable-free calcium imaging from &gt;8,500 neurons per animal (25&#x2011;fold increase). Paired with a zero-shot behavior analyzer, Airscope enables cortical imaging across rich behavioral conditions, including room-scale enriched arenas, swimming assays, and multi-organ implantation, with concurrent recording from multiple animals. Using Airscope, we demonstrate versatile applications of untethered cortical imaging across diverse behavioral paradigms. We identify cortical activity patterns across multiple dorsal regions that correlate with behavioral signatures of social dominance, and show dorsal-cortical population activity prospectively decodes competition outcomes across paired animals. We observe reward-location-associated cortical activity patterns during maze exploration, and characterize Granger-causal influence from spinal cord to cortex during fear conditioning, enabled by simultaneous brain-spinal recordings. By uniting large-scale, cellular-resolution recording with unconstrained behavior, Airscope makes naturalistic, multi-animal cortical recording experimentally practical, and provides a broadly accessible technology for systems neuroscience.", "abstract_zh": "揭示分布式皮层回路如何在自由活动动物中协调行为仍是系统神经科学的中心挑战，受限于视野小、通量低以及现有微型显微镜所需的连线束缚。在此，我们推出Airscope——一种无线介观显微镜，在6毫米视野、12.5 Hz下实现4微米横向分辨率，重量仅1.0克。其非球面透镜设计使总光程比以往微型显微镜缩短2.84倍，同时达到台式单光子介观显微镜的神经元捕获量；定制的无线链路支持每只动物无缆钙成像超过8500个神经元（提升25倍）。配合零样本行为分析器，Airscope可在丰富行为条件下（包括房间尺度的丰富环境、游泳测试和多种器官植入）实现皮层成像，并可对多个动物同步记录。利用Airscope，我们展示了在无束缚条件下跨多种行为范式的皮层成像应用：识别出与社会支配行为特征相关的多个背侧皮层活动模式，并显示背侧皮层群体活动可前瞻性地解码配对动物间的竞争结果；观察到迷宫探索中与奖励位置相关的皮层活动模式，并通过脑-脊髓同步记录刻画了恐惧条件反射中从脊髓到皮层的格兰杰因果影响。通过将大规模、细胞分辨率的记录与无约束行为结合，Airscope使自然化、多动物的皮层记录成为实验上可行的现实，并为系统神经科学提供了一种广泛可及的技术。", "summary_zh": "研制出重仅1克、视野6毫米、可无线记录逾8500个神经元钙信号的介观显微镜Airscope，摆脱连线束缚。结合零样本行为分析，实现了自由活动乃至多动物同步的皮层成像，并揭示与社会支配、空间记忆、恐惧条件反射相关的皮层活动模式。", "highlight": "推出1克级无线介观显微镜，使自由活动动物的全皮层、多动物同步神经成像成为可行，大幅降低系统神经科学实验门槛。", "pmid": "42896839"}, {"title": "Gate-tunable chiral spin mode in WSe2/WS2 moiré superlattices", "title_zh": "WSe2/WS2莫尔超晶格中栅极可调的手性自旋模式", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.adq6530", "url": "https://www.science.org/doi/abs/10.1126/science.adq6530", "abstract": "The interplay between many-body and spin-orbit coupling (SOC) effects can lead to previously unobserved phenomena in solids. Chiral spin modes (CSMs) are collective spin excitations that arise from such interplay and connect states with opposite chirality. Here, we report a gate-tunable CSM that occurs between conduction SOC-split minibands in near-0&#xb0;-twisted WSe2/WS2 bilayers. This mode manifests as a sharp resonance with giant Raman efficiency in the pseudovector-symmetry channel of the Raman spectra. By varying the filling, the CSM transitions from a chiral spin exciton to an excitonic polaron. The spin-flip nature is directly confirmed by the Zeeman effect, and the filling dependence indicates a charge-transfer insulator at unity filling. Our results demonstrate that transition metal-dichalcogenide moir&#xe9; superlattices are a fertile platform for exploring exotic low-lying collective excitations.", "abstract_zh": "多体效应与自旋轨道耦合（SOC）效应之间的相互作用可在固体中产生此前未被观测到的现象。手性自旋模式（CSM）正是这种相互作用产生的集体自旋激发，连接具有相反手性的态。在此，我们报道了在近0°扭转的WSe2/WS2双层中，导带SOC分裂的小能带之间出现的一种可由栅压调控的CSM。该模式表现为拉曼谱伪矢量对称通道中具巨大拉曼效率的尖锐共振。通过改变填充度，CSM从手性自旋激子转变为激子极化子。其自旋翻转本质由塞曼效应直接确认，而填充依赖关系表明在满填充时形成电荷转移绝缘体。我们的结果证明，过渡金属硫族化物莫尔超晶格是探索奇异低能集体激发的丰厚平台。", "summary_zh": "在近乎0°扭转的WSe2/WS2双层中观测到一种栅压可调的手性自旋模式，表现为拉曼谱中具巨拉曼效率的尖锐共振，并随填充度在自旋激子与激子极化子间转变。", "highlight": "在莫尔超晶格中实现栅压可调的手性集体自旋激发，为自旋电子学低能激发研究提供新平台。", "pmid": "42879561"}, {"title": "A pair of chitosan receptors confer broad-spectrum fungal resistance", "title_zh": "一对壳聚糖受体赋予广谱抗真菌抗性", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.ady7647", "url": "https://www.science.org/doi/abs/10.1126/science.ady7647", "abstract": "Chitosan, a major fungal cell wall component, activates plant immunity, yet the underlying perception mechanism remains unknown. In this study, we identified OsFID1, an apoplast-localized DUF26 domain protein, as a chitosan-binding receptor essential for chitosan-triggered immunity. OsFID1 forms a receptor complex with OsFID2, a plasma membrane-localized DUF26 receptor-like kinase, to mediate chitosan sensing and immune activation, requiring OsFID2 phosphorylation for function. The OsFID1-OsFID2 complex confers broad-spectrum resistance to fungal pathogens. OsFID1 homologs are conserved in land plants, which show chitosan-binding activity in both monocots and dicots. Ectopic expression of OsFID1 in wheat and maize enhanced fungal resistance without growth penalty. These findings uncover a conserved receptor complex for direct chitosan sensing, advancing our understanding of plant-fungus interactions and providing a potential strategy for engineering durable fungal resistance crops.", "abstract_zh": "壳聚糖是真菌细胞壁的主要成分，可激活植物免疫，但其感知机制尚不清楚。本研究中，我们鉴定出OsFID1——一种定位于质外体的DUF26结构域蛋白——作为壳聚糖结合受体，是壳聚糖触发免疫所必需的。OsFID1与定位于质膜的DUF26受体样激酶OsFID2形成受体复合物，介导壳聚糖感知与免疫激活，其功能需要OsFID2的磷酸化。OsFID1–OsFID2复合物赋予对真菌病原体的广谱抗性。OsFID1的同源蛋白在陆生植物中保守，且在单子叶与双子叶植物中均表现出壳聚糖结合活性。在小麦和玉米中异位表达OsFID1增强了真菌抗性而无生长代价。这些发现揭示了一个感知壳聚糖的保守受体复合物，增进了我们对植物–真菌互作的理解，并为培育持久抗真菌作物提供了潜在策略。", "summary_zh": "发现OsFID1–OsFID2受体复合物直接感知真菌细胞壁成分壳聚糖并激活广谱免疫，该机制在陆生植物中保守；在小麦、玉米中异位表达即可增强抗真菌能力且无生长代价。", "highlight": "阐明植物直接感知壳聚糖的保守受体复合物，为设计持久抗真菌作物提供新靶点。", "pmid": "42879563"}, {"title": "Regulation of target gene expression by chromatin-associated protein-coding transcripts in plants", "title_zh": "植物中染色质相关蛋白编码转录本对靶基因表达的调控", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.adz4903", "url": "https://www.science.org/doi/abs/10.1126/science.adz4903", "abstract": "Protein-coding transcripts are regarded as intermediates that mediate DNA-to-protein information flow, leaving their noncoding regulatory potential largely underappreciated. Genome-wide profiling of RNA-chromatin interactions in Arabidopsis has uncovered widespread associations between protein-coding transcripts and distinct genomic loci, implying that they possess regulatory functions. Here, we found that BT2 and GSL8 transcripts modulate target gene transcription independently of their protein products through distinct mechanisms. The BT2 transcript represses transcription of its targets CEP2 and MRF4 by forming RNA-DNA triplexes, thereby restricting root growth and promoting flowering, whereas GSL8 acts through a triplex-independent pathway. Our findings unveil intrinsic regulatory activities of protein-coding transcripts, challenging the canonical definition of mRNA function and blurring the functional distinction between coding and noncoding RNAs in the context of genome evolution.", "abstract_zh": "蛋白质编码转录本被视为介导DNA到蛋白质信息流的中间体，其非编码调控潜能长期被低估。拟南芥中RNA–染色质相互作用的全基因组分析揭示了蛋白质编码转录本与特定基因组位点之间广泛关联，暗示其具有调控功能。在此，我们发现BT2与GSL8转录本通过不同机制，独立于其蛋白质产物来调控靶基因转录。BT2转录本通过形成RNA–DNA三链体抑制其靶标CEP2和MRF4的转录，从而限制根生长并促进开花；而GSL8则通过不依赖三链体的途径发挥作用。我们的发现揭示了蛋白质编码转录本内在的调控活性，挑战了mRNA功能的经典定义，并模糊了编码RNA与非编码RNA在基因组演化背景下的功能界限。", "summary_zh": "发现拟南芥中BT2、GSL8等蛋白质编码转录本可不依赖其翻译产物、通过RNA–DNA三链体等机制直接调控靶基因转录，限制根生长、促进开花。", "highlight": "揭示mRNA本身可作为调控分子直接调控基因转录，挑战“mRNA仅作翻译模板”的经典定义。", "pmid": "42879536"}, {"title": "Dendritic computation for abstract rule-based flexible decision-making", "title_zh": "基于抽象规则的灵活决策中的树突计算", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.adz5323", "url": "https://www.science.org/doi/abs/10.1126/science.adz5323", "abstract": "Intelligent behavior involves flexible integration of sensory input and abstract rule knowledge. Dendritic computation has been shown to contribute to top-down modulation of sensory processing; however, whether and how it is involved in flexible cognitive processing remains to be elucidated. Combining a rule-based flexible decision-making task with in vivo two-photon imaging and optogenetics in mice, we found that within single layer 5 extratelencephalic neurons in the auditory cortex, apical dendrites preferentially encoded the inferred abstract rule and somata preferentially represented sensory stimuli, whereas choice signals were present in both compartments. Optogenetic dendritic inhibition impaired rule-dependent somatic choice coding, supporting a task-relevant integration across the dendritic and somatic compartments. These results indicate that dendritic computation in cortical neurons mediates flexible behavior.", "abstract_zh": "智能行为涉及对感觉输入与抽象规则知识的灵活整合。树突计算已被证明参与感觉处理的自上而下调制；然而其是否及如何参与灵活的认知加工仍有待阐明。结合基于规则的灵活决策任务与小鼠在体双光子成像和光遗传学，我们发现听觉皮层第5层外大脑神经元内，顶端树突优先编码推断出的抽象规则，胞体优先表征感觉刺激，而抉择信号则同时存在于两个区室中。光遗传树突抑制损害了依赖于规则的胞体抉择编码，支持在树突与胞体区室间进行的任务相关整合。这些结果表明，皮层神经元的树突计算介导了灵活行为。", "summary_zh": "在小鼠听觉皮层单神经元内发现顶端树突优先编码抽象规则、胞体优先编码感觉刺激，光遗传抑制树突会破坏规则依赖的抉择，证明树突计算支撑灵活决策。", "highlight": "证明单个皮层神经元的树突区室可编码抽象规则，为“树突计算介导灵活认知”提供直接证据。", "pmid": "42879555"}, {"title": "Empirical constraints on ice cliff calving", "title_zh": "冰崖崩裂的经验约束", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.aee0658", "url": "https://www.science.org/doi/abs/10.1126/science.aee0658", "abstract": "When calving cliffs at the margins of Earth's ice sheets exceed a critical height, runaway retreat may be initiated in a process called the marine ice cliff instability. However, sufficiently tall ice cliffs have rarely been observed. To address this gap, we measured the characteristics of 15,330 ice cliffs across Earth's ice sheet margins using laser altimetry. We show that cliff height is highly correlated with m&#xe9;lange thickness, water depth, and crevassing. We found that tall cliffs calve more rapidly than parameterizations assume, but dynamic thinning and retreat into regions with low ice thickness gradients prevent runaway retreat. These observations suggest that model projections may underestimate subannual rates of cliff calving, but that the potential for instability will depend sensitively on additional quantities, not cliff height alone.", "abstract_zh": "当地球冰盖边缘的崩解崖超过临界高度时，可能启动一种称为“海洋冰崖失稳”的失控退缩过程。然而，足够高的冰崖极少被观测到。为弥补这一空白，我们利用激光测高仪测量了地球冰盖边缘15,330座冰崖的特征。我们显示冰崖高度与混合冰厚度、水深和裂隙发育高度相关。我们发现高冰崖的崩解速度比参数化模型假设的更快，但动态减薄和向冰厚度梯度较低区域的退缩阻止了失控退缩。这些观测表明，模型投影可能低估了冰崖崩解的次年度速率，但失稳的可能性将敏感地取决于除冰崖高度之外的其他量。", "summary_zh": "基于15,330座冰崖的激光测高数据，发现冰崖高度与混合冰厚度、水深、裂隙相关，高冰崖崩解更快，但动态减薄阻止了失控退缩，提示模型需修正。", "highlight": "用大样本实测约束冰崖崩解参数，表明冰崖失稳风险取决于多重因素而非仅高度，修正了冰盖模型假设。", "pmid": "42879549"}, {"title": "Engineering ordered two-dimensional defect phases to strengthen structural alloys", "title_zh": "工程化有序二维缺陷相以增强结构合金强度", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.aeh1409", "url": "https://www.science.org/doi/abs/10.1126/science.aeh1409", "abstract": "Defects in crystals are usually considered to be consequences of deformation, but they can also be engineered as strengthening features. Planar defects can strengthen structural alloys but usually form only during deformation or service, limiting control over their density, stability, and chemistry. We show that predeformation followed by aging can convert such defects into a designed architecture of ordered defect phases. In a single-crystal cobalt-nickel-based superalloy and a polycrystalline cobalt-chromium-tungsten alloy, this treatment creates dense networks of coherent, atomically thin, ordered defect-confined phases. These increase room-temperature strength by more than 200 megapascals and reduce the superalloy's minimum creep rate by more than threefold. Electron microscopy and simulations show that local chemical ordering amplifies strengthening and that the ordered defect phases remain shearable while impeding slip transmission.", "abstract_zh": "晶体中的缺陷通常被视为变形的结果，但也可被设计成强化特征。面缺陷可强化结构合金，但通常仅在变形或使用过程中形成，限制了对密度、稳定性和化学组成的控制。我们展示预变形后时效处理可将此类缺陷转化为有序缺陷相的设计化结构。在一种单晶钴镍基高温合金和一种多晶钴铬钨合金中，该处理产生了致密、相干、原子级薄的有序缺陷约束相网络。这些相使室温强度提高超过200兆帕，并使高温合金的最小蠕变速率降低超过三倍。电子显微镜与模拟显示，局域化学有序增强了强化效应，且有序缺陷相在可被剪切的同时阻碍位错传递。", "summary_zh": "通过“预变形+时效”在钴镍高温合金与钴铬钨合金中构筑原子级薄的有序缺陷相网络，室温强度提升>200 MPa、蠕变速率降低超三倍。", "highlight": "将缺陷工程化为有序相来强化合金，开辟了通过调控缺陷结构提升材料性能的新路径。", "pmid": "42879544"}, {"title": "Deterministic generation and distribution of genuine multipartite entanglement in macroscopic acoustic resonators", "title_zh": "宏观声学谐振子中真正多体纠缠的确定性产生与分发", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.aeh4273", "url": "https://www.science.org/doi/abs/10.1126/science.aeh4273", "abstract": "Generating complex multimode entanglement is a central goal of quantum information science. However, scalable creation of genuine multipartite entanglement is challenging as it requires excellent control and efficient state verification. We report the generation and transfer of genuine multimode entanglement across two multimode acoustic resonators. We prepare genuine multipartite entangled states involving two, four, and six modes across the resonators with respective fidelities of 0.912 &#xb1; 0.003, 0.790 &#xb1; 0.003, and 0.570 &#xb1; 0.001. We further demonstrate the transfer of two- and four-mode genuine entangled states between the resonators with fidelities of 0.785 &#xb1; 0.006 and 0.601 &#xb1; 0.006. This hardware-efficient and scalable architecture enables deterministic control and generation of complex multimode mechanical states. Our results push the boundary of quantum control in macroscopic mechanical systems, establishing a pathway toward large-scale mechanical quantum networks.", "abstract_zh": "生成复杂的多模纠缠是量子信息科学的中心目标。然而，真正多体纠缠的可扩展生成具有挑战性，因为它需要出色的控制与高效的状态验证。我们报道了在两个多模声学谐振器之间真正多模纠缠的生成与传递。我们制备了跨越谐振器的涉及2、4、6个模式的真正多体纠缠态，保真度分别为0.912±0.003、0.790±0.003和0.570±0.001。我们进一步展示了两模和四模真正纠缠态在谐振器间的传递，保真度分别为0.785±0.006和0.601±0.006。这一硬件高效且可扩展的架构实现了对复杂多模机械态的确定性控制与生成。我们的结果推进了宏观机械系统中的量子控制边界，为大规模机械量子网络开辟了道路。", "summary_zh": "在两个多模声学谐振器间确定性生成并传递2/4/6模的真正多体纠缠态，保真度随模式数变化，架构可扩展。", "highlight": "在宏观声学谐振器中实现真正多体纠缠的确定性生成与传递，向大规模机械量子网络迈进。", "pmid": "42879554"}, {"title": "Modular van der Waals MOSFETs through layer-by-layer chalcogen substitutions", "title_zh": "通过逐层硫族元素替代构建模块化范德华MOSFET", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.aei2693", "url": "https://www.science.org/doi/abs/10.1126/science.aei2693", "abstract": "In two-dimensional transition-metal dichalcogenides (TMDCs), the local electrostatic field of the chalcogen p-orbitals dictates the crystal field splitting of the transition metal d-orbitals, stabilizing diverse electronic states from semiconducting and semimetallic to exotic topological phases. On-demand substitution of the lattice chalcogens is therefore an efficient route to tuning TMDC electronic phases. Here, we custom-molded van der Waals (vdW) heterostructures by layer-by-layer vapor-phase chalcogen substitution starting from p-type WSe2 multilayers into which we locally inscribed insulating WOx, n-type WS2, and semimetallic WTe2. This spatially precise conversion seamlessly integrated distinct electronic phases, both vertically and laterally, into modular vdW semiconductor heterostructures that are otherwise inaccessible. As a demonstration, we integrated WOx/WSe2 local gate stacks to build ultrascaled metal oxide-semiconductor field effect transistors (MOSFETs), achieving an unprecedented subthreshold swing at subnanometer equivalent oxide thickness.", "abstract_zh": "在二维过渡金属硫族化物（TMDC）中，硫族p轨道的局部静电场决定了过渡金属d轨道的晶体场分裂，稳定了从半导体、半金属到奇异拓扑相的多种电子态。因此按需替换晶格中的硫族元素是调控TMDC电子相的高效途径。在此，我们以p型WSe2多层为起点，通过逐层气相硫族取代，局部写入绝缘WOx、n型WS2和半金属WTe2，定制构建了范德华（vdW）异质结构。这种空间精确的转换将不同的电子相在垂直与横向维度上无缝集成进模块化的vdW半导体异质结构，而这是其他方法无法实现的。作为演示，我们集成WOx/WSe2局域栅堆栈构建了超缩放金属氧化物半导体场效应晶体管（MOSFET），在亚纳米等效氧化层厚度下实现了前所未有的亚阈值摆幅。", "summary_zh": "通过逐层气相硫族取代，在WSe2中局部转换为绝缘WOx、n型WS2、半金属WTe2，构建模块化vdW异质结构，并据此制成亚纳米栅厚的超缩放MOSFET。", "highlight": "用逐层硫族取代实现电子相的像素级“定制打印”，为模块化二维电子器件提供新范式。", "pmid": "42879551"}, {"title": "In situ structure of the human ciliary transition zone links linker defects to primary ciliary dyskinesia", "title_zh": "人纤毛过渡区的原位结构将连接蛋白缺陷与原发性纤毛运动障碍相联系", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.aei5957", "url": "https://www.science.org/doi/abs/10.1126/science.aei5957", "abstract": "The ciliary transition zone (TZ) regulates ciliary proteome composition, yet its molecular architecture, protein content, and contribution to motile ciliopathies remain poorly defined. We applied in situ cryo-electron tomography and subtomogram averaging to human multiciliated epithelial cells. This approach resolved TZ-specific doublet microtubules at subnanometer resolution and identified nine constituent proteins. We found that epithelial cell transforming 2 like (ECT2L) and double zinc ribbon and ankyrin repeat-containing protein 1 (DZANK1) form the major linker complexes between adjacent TZ doublet microtubules. Biallelic loss-of-function variants in either gene cause primary ciliary dyskinesia. ECT2L and DZANK1 deficiency disrupted TZ architecture, caused microtubular abnormalities and abnormal bulbous ciliary tips, and impaired mucociliary clearance. These findings establish a direct genetic link between TZ defects and human motile ciliopathy and illustrate how in situ structural biology can uncover mechanisms of human disease.", "abstract_zh": "纤毛过渡区（TZ）调控纤毛蛋白质组组成，但其分子结构、蛋白质组成以及对运动纤毛病的作用仍不清楚。我们通过对人类多纤毛上皮细胞的原位冷冻电子断层成像与子断层平均，以亚纳米分辨率解析了TZ特异性的双联微管，并鉴定出9种组成蛋白。我们发现上皮转化蛋白2样（ECT2L）与双锌指核糖核酸结合锚蛋白重复蛋白1（DZANK1）构成相邻TZ双联微管之间的主要连接复合物。任一基因的双侧功能缺失变异都会导致原发性纤毛运动障碍。ECT2L与DZANK1缺陷破坏了TZ结构，引起微管异常和异常的球状纤毛顶端，并损害黏液纤毛清除。这些发现建立了TZ缺陷与人类运动纤毛病之间的直接遗传学联系，并说明了原位结构生物学如何揭示人类疾病的机制。", "summary_zh": "以亚纳米分辨率解析人纤毛过渡区结构，发现ECT2L–DZANK1连接复合物，其突变导致原发性纤毛运动障碍，建立TZ缺陷与疾病的直接遗传联系。", "highlight": "原位解析纤毛过渡区结构并定位致病连接蛋白，直接阐明一类运动纤毛病的分子机制。", "pmid": "42721274"}, {"title": "Frequency encoding regulates cell type composition in the small intestine", "title_zh": "频率编码调控小肠细胞类型组成", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.adt1928", "url": "https://www.science.org/doi/abs/10.1126/science.adt1928", "abstract": "Intestinal homeostasis requires tight regulation of stem cell maintenance and differentiation to absorptive and secretory cell types, two major intestinal lineages. Key signaling pathways have been identified, but how they balance cell type composition remains unclear. We uncovered oscillatory expression of the Notch-target protein Hes1 (hairy and enhancer of split 1) that controls cell fate specification in a frequency-dependent manner. An endogenous fluorescent Hes1 reporter revealed distinct, cell type-specific oscillation frequencies forming a gradient along the crypt-villus axis, which was modulated by cell cycle phase as well as Wnt (wingless-related integration site)-signaling and Notch-signaling activity. We developed a microfluidic system to modulate Notch-signaling oscillations in organoids and found the oscillation frequency to regulate the balance of cell type composition. This study provides evidence that information for cell fate specification is encoded in the frequency of an oscillatory signal.", "abstract_zh": "肠道稳态需要对干细胞维持及其向吸收性与分泌性两类主要肠细胞谱系的分化进行严格调控。关键信号通路已被确定，但它们如何平衡细胞类型组成仍不清楚。我们发现了Notch靶蛋白Hes1（hairy and enhancer of split 1）的振荡表达以频率依赖的方式控制细胞命运决定。内源荧光Hes1报告系统揭示了沿隐窝–绒毛轴形成梯度的、细胞类型特异的振荡频率，该梯度受细胞周期阶段以及Wnt信号与Notch信号活性的调节。我们开发了微流控系统来调节类器官中的Notch信号振荡，发现振荡频率调控着细胞类型组成的平衡。本研究提供的证据表明，细胞命运决定的信息编码于振荡信号的频率之中。", "summary_zh": "发现Notch靶蛋白Hes1的振荡频率沿隐窝–绒毛轴梯度分布，并用微流控调控证明振荡频率决定小肠吸收/分泌细胞的比例。", "highlight": "提出“频率编码”机制——细胞命运信息由振荡信号频率承载，刷新了对Notch调控的理解。", "pmid": "42879562"}, {"title": "Structural basis for size-selective perception of chitin in plants", "title_zh": "植物中几丁质尺寸选择性识别的结构基础", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.adz4600", "url": "https://www.science.org/doi/abs/10.1126/science.adz4600", "abstract": "Plants detect microbes through pattern recognition receptors that perceive conserved microbial surface motifs known as microbe-associated molecular patterns (MAMPs). Lysin motif (LysM) receptors recognize and mediate downstream responses to chitinous MAMPs. In this study, we elucidated the mechanism for the specific recognition of long-chain chitin oligomers and identified a hallmark bridge domain characteristic of the CHITIN PERCEPTION (CHIP) receptor class. Structural analysis of receptor-ligand complexes, biochemistry, and in planta functional studies of inhibitory nanobodies revealed the mechanism of size-selective, high-affinity chitin perception in Lotus japonicus and Medicago truncatula. Additionally, we identified the CHITIN ELICITOR RECEPTOR KINASE (CERK) class as low-affinity, yet essential, co-receptors and propose a mechanistic model for a ligand-induced core signaling heterocomplex. Our findings establish the structural and mechanistic basis of differential chitin perception and receptor complex assembly in chitin-elicited plant immune signaling.", "abstract_zh": "植物通过模式识别受体感知微生物，这些受体识别被称为微生物相关分子模式（MAMPs）的保守微生物表面基序。溶菌酶基序（LysM）受体识别几丁质类MAMPs并介导下游反应。本研究中，我们阐明了特异性识别长链几丁质寡聚体的机制，并鉴定出CHITIN PERCEPTION（CHIP）受体类的特征性桥接结构域。对受体–配体复合物的结构分析、生物化学以及在植物体内的抑制性纳米抗体功能研究，揭示了百脉根与蒺藜苜蓿中尺寸选择性、高亲和力的几丁质感知机制。此外，我们确定CERK类为低亲和力但必需的共受体，并提出配体诱导的核心信号异源复合物的机制模型。我们的发现确立了几丁质激发的植物免疫信号中差异化几丁质感知与受体复合物组装的结构与机制基础。", "summary_zh": "解析CHIP类受体通过特征性桥接结构域实现长链几丁质寡聚体的尺寸选择性高亲和力识别，并阐明其与CERK共受体组装的信号复合体模型。", "highlight": "揭示植物按“链长”尺寸选择性识别几丁质的受体结构机制，深化对植物免疫模式识别的理解。", "pmid": "42879538"}, {"title": "Airflows redefine the cost of aerial transport in the wild", "title_zh": "气流重新定义了野外飞行运输的成本", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.aee6550", "url": "https://www.science.org/doi/abs/10.1126/science.aee6550", "abstract": "Fuel economy matters to both animals and machines, as the cost of transport can determine where, when, and how far locomotion is possible. However, established estimates of these values for animal flight come from laboratories and treat the atmosphere as constant, even though free-flying animals routinely extract energy from atmospheric flows. Using high-resolution movement data, we estimate the cost of transport for 50 bird and bat species flying in the wild. Our results revise the classic ranking of locomotion costs, suggesting that flying can be cheaper than swimming though almost as costly as running, depending on interactions between physical environment, morphology, and behavior. Linking transport costs to atmospheric conditions provides a mechanistic basis for predicting how changing windscapes will reshape the energetics, movements, and distributions of flying animals.", "abstract_zh": "燃料经济性对动物和机器都至关重要，因为运输成本决定了运动在何处、何时以及多远成为可能。然而，关于动物飞行的既有估计来自实验室，并将大气视为恒定不变，尽管自由飞行的动物 routinely 从大气流中提取能量。利用高分辨率运动数据，我们估计了50种鸟类和蝙蝠在野外飞行时的运输成本。我们的结果修正了经典的运动成本排序，表明飞行可能比游泳更便宜、但几乎与奔跑一样昂贵，具体取决于物理环境、形态和行为之间的相互作用。将运输成本与大气条件相联系，为预测变化中的风场如何重塑飞行动物的能量代谢、运动与分布提供了机制性基础。", "summary_zh": "基于50种鸟类和蝙蝠的野外高分辨率轨迹，重估飞行运输成本，发现借助气流飞行可低于游泳、接近奔跑，并取决于环境–形态–行为的相互作用。", "highlight": "用野外实测推翻实验室的飞行能耗排序，证明大气流可显著降低飞行成本，为预测风场变化影响提供机制基础。", "pmid": "42879545"}, {"title": "Electrically driven chiral emission from plasmonic tunnel junctions", "title_zh": "等离子体隧道结中的电驱动手性发射", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.aeh4015", "url": "https://www.science.org/doi/abs/10.1126/science.aeh4015", "abstract": "Chirality plays a crucial role in a broad range of processes, including light-matter interactions in physics, chemistry, and biology, while quantum tunneling provides a promising mechanism for light generation at the nanoscale. By integrating tunnel junctions with chiral plasmonic nanohelicoids, we achieved electrically induced nanoscale generation of chiral light at the single-particle level. The tunneling-driven resonant excitation of chiral dipolar modes of the nanohelicoids results in emission of a vortex light beam possessing both spin angular momentum with handedness selectivity of more than 0.8 and orbital angular momentum equal in magnitude and opposite in sign. Our electrically driven approach offers a means for engineering photon spin generation at the nanoscale, highlighting its potential for next-generation optical components in display applications, as well as quantum information processing and photochemistry.", "abstract_zh": "手性在物理、化学和生物的广泛过程中起关键作用，而量子隧穿为纳米尺度光生成提供了有前景的机制。通过将隧穿结与手性等离子体纳米螺旋结构集成，我们在单粒子水平实现了电诱导的手性光的纳米尺度生成。隧穿驱动的手性纳米螺旋偶极模式的共振激发，产生具有自旋角动量（手性选择性>0.8）和大小相等、符号相反的轨道角动量的涡旋光束发射。这种电驱动方法为在纳米尺度设计光子自旋生成提供了手段，凸显了其在显示应用以及量子信息处理和光化学中下一代光学元件的潜力。", "summary_zh": "将隧穿结与手性等离子体纳米螺旋集成，在单粒子尺度用电驱动产生具高自旋手性选择性（>0.8）的涡旋光束，实现纳米级手性光生成。", "highlight": "用电学手段在纳米尺度确定性产生手性光，为下一代手性光源与量子光电器件提供新路线。", "pmid": "42879559"}, {"title": "Glycan recognition by a plant damage-sensing immune receptor", "title_zh": "植物损伤感应免疫受体对糖类的识别", "journal": "Science", "date": "2026-10-15", "type": "Article", "doi": "10.1126/science.aec6740", "url": "https://www.science.org/doi/abs/10.1126/science.aec6740", "abstract": "Pathogens target and degrade the extracellular matrix surrounding plant cells. A central question is how cell wall-derived damage-associated molecular patterns (DAMPs) are recognized and integrated to trigger immune responses. We address this question by determining the structure of the extracellular multidomain of the impaired in glycan perception 1 (IGP1) receptor in both apo form and bound to the cellulose-derived DAMP cellotriose. Structural analyses reveal that constitutive interactions of leucine-rich repeat (LRR)-malectin domains preconfigure IGP1 for ligand recognition and that the receptor features a highly specific sugar-binding pocket in the LRR domain capable of distinguishing fine variations in glycan structures. By directly sensing cello-oligomers, IGP1 operates as a cell wall surveillance receptor that links pathogen-induced wall degradation to immune alerting, equipping plants to mount rapid and robust defense responses.", "abstract_zh": "病原体靶向并降解植物细胞周围的细胞外基质。一个核心问题是如何识别并整合细胞壁衍生的损伤相关分子模式（DAMPs）以触发免疫响应。我们通过解析损伤性糖感知缺陷1（IGP1）受体胞外多结构域在apo态及结合纤维素衍生的DAMP——纤维三糖时的结构来解答这一问题。结构分析显示，富含亮氨酸重复（LRR）–麦芽凝集素结构域的组成性相互作用预先配置了IGP1的配体识别能力，且该受体在LRR结构域具有能区分糖链结构细微差异的高度特异性糖结合口袋。通过直接感知纤维素寡聚体，IGP1作为一种细胞壁监视受体，将病原体诱导的壁降解与免疫警报相联，使植物能够快速而稳健地启动防御响应。", "summary_zh": "解析植物损伤感知受体IGP1的结构，发现其通过LRR–malectin结构域预配置并在LRR形成高特异性糖结合口袋，直接识别纤维素寡聚体DAMP以触发免疫。", "highlight": "阐明植物细胞壁损伤感知受体IGP1识别糖链DAMP的结构机制，揭示细胞壁“监视”免疫的入口。", "pmid": "42721272"}, {"title": "A pseudoenzyme sensor of trehalose-6-phosphate directly represses the metabolic integrator SnRK1 in plants", "title_zh": "海藻糖-6-磷酸的假酶传感器直接抑制植物的代谢整合因子SnRK1", "journal": "Cell", "date": "2026-10-14", "type": "Article", "doi": "10.1016/j.cell.2026.09.016", "url": "https://doi.org/10.1016/j.cell.2026.09.016", "abstract": "Trehalose-6-phosphate (T6P) is a central metabolic signal linking sugar availability to plant growth, carbon utilization, and productivity, yet its sensing and signaling mechanisms remain elusive. Using chemical biology and functional approaches, we identify the noncatalytic pseudoenzyme Class-II T6P synthase (TPS-II) as a T6P sensor in Arabidopsis. In the apo state, TPS-II dimerizes to form an autoinhibitory inter-subunit interaction. T6P binding to the N-terminal TPS-like domain triggers a conformational change that releases the C-terminal domain, enabling interaction with the central metabolic integrator SNF1-related protein kinase 1 (SnRK1) to repress its kinase activity. Loss of TPS-II genes activates catabolic and stress-responsive programs while suppressing anabolic gene expression, consistent with constitutive SnRK1 activity. Conservation of this T6P-TPS-II-SnRK1 signaling axis throughout the plant kingdom highlights its fundamental role in coupling carbon availability to metabolic homeostasis. These findings resolve a long-standing question in sugar signaling and provide a framework for improving crop carbon-use efficiency.", "abstract_zh": "海藻糖-6-磷酸（T6P）是连接糖可用性与植物生长、碳利用与产量的中心代谢信号，但其感知与信号机制仍不清楚。利用化学生物学与功能方法，我们鉴定出非催化型假酶II类T6P合酶（TPS-II）作为拟南芥中的T6P感受器。在脱辅基状态，TPS-II形成二聚体并产生自抑制的亚基间相互作用。T6P结合N端TPS样结构域触发构象变化，释放C端结构域，从而与中心代谢整合因子SnRK1（SNF1相关蛋白激酶1）互作并抑制其激酶活性。TPS-II基因缺失会激活分解代谢与应激反应程序，同时抑制合成代谢基因表达，与SnRK1持续活化一致。这一T6P—TPS-II—SnRK1信号轴在植物界的保守性凸显其在耦合碳可用性与代谢稳态中的根本作用。这些发现解决了糖信号中的一个长期问题，并为提高作物碳利用效率提供了框架。", "summary_zh": "发现假酶TPS-II作为T6P感受器，经变构抑制SnRK1，揭示植物碳信号—代谢稳态的核心轴。", "highlight": "鉴定非催化假酶TPS-II为T6P感受器并抑制SnRK1，破解植物糖信号长期谜题。"}, {"title": "A phenome-wide structural variant map from 467,152 UK Biobank genomes", "title_zh": "基于467,152例英国生物样本库基因组的表型组范围结构变异图谱", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.035", "url": "https://doi.org/10.1016/j.cell.2026.09.035", "abstract": "Structural variants (SVs) are large (>50 base pairs) genomic rearrangements that can significantly influence human phenotypes, yet their contribution to health and disease remains undercharacterized. We conducted a phenome-wide association study (PheWAS) of 1.6 million SVs identified in whole-genome sequencing data from 467,152 UK Biobank participants, across 13,322 binary, 2,018 quantitative, and 2,923 plasma protein traits. Of these, 82.25% of SVs were outside the detectable range of prior copy-number variant studies. Protein quantitative trait loci analysis linked 3,241 SVs to 1,608 proteins, with effects dependent on SV type and location. In SV-PheWAS, we detected 28,184 associations with human health outcomes. Notably, we uncovered rare SVs with strong phenotypic effects. Furthermore, we show that at known genome-wide association study loci, 32.21% of associated SVs overlapped functional genomic regions. This study underscores the underestimated role of SVs in human genetics and their potential to advance understanding of human biology and drug discovery.", "abstract_zh": "结构变异（SV）是大于50 bp的基因组重排，可显著影响人类表型，但其对健康与疾病的贡献仍未被充分刻画。我们对来自467,152名英国生物样本库参与者的全基因组测序数据中鉴定的160万个SV进行了表型组范围关联研究（PheWAS），涵盖13,322个二分类、2,018个定量及2,923个血浆蛋白性状。其中82.25%的SV超出既往拷贝数变异研究的可检测范围。蛋白数量性状位点分析将3,241个SV与1,608种蛋白相关联，其效应取决于SV的类型与位置。在SV-PheWAS中，我们检测到28,184个与人体健康结局的关联。值得注意的是，我们发现了具有强表型效应的罕见SV。此外，在已知GWAS位点，32.21%的相关SV与功能性基因组区域重叠。本研究凸显了SV在人类遗传学中被低估的作用及其推进人类生物学与药物发现的潜力。", "summary_zh": "利用46万余人全基因组数据绘制最大规模SV表型组图谱，揭示大量既往CNV研究遗漏的SV及其广泛健康关联。", "highlight": "发布迄今最大的人类结构变异表型组图谱，显示SV对表型与疾病的贡献被严重低估。"}, {"title": "Mitochondria-targeted tetraoxanes initiate lipid peroxidation to drive ferroptosis and tumor suppression", "title_zh": "线粒体靶向四氧烷启动脂质过氧化以驱动铁死亡与肿瘤抑制", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.040", "url": "https://doi.org/10.1016/j.cell.2026.09.040", "abstract": "Ferroptosis is implicated as a vulnerability in multiple cancers, yet approaches for effectively inducing ferroptosis in vivo are limited. Bypassing conventional strategies targeting the antiferroptotic glutathione peroxidase 4 (GPX4) and ferroptosis suppressor protein 1 (FSP1) proteins, we designed metabolic initiators of lipid peroxidation (MILPOs) and developed the compounds WMK-1/2, which contain tetraoxane radical-generating and mitochondria-targeting groups, as de novo ferroptosis inducers. WMK-1 localizes primarily to mitochondria, induces local lipid peroxidation, and impairs oxidative phosphorylation. WMK-1 induces a \"mito-ferroptosis\" sub-pathway that skips GPX4 inhibition as a prerequisite, can be rescued by lipophilic radical-trapping antioxidants, yet is minimally sensitive to acyl-coenzyme A synthetase long-chain family member 4 (ACSL4) perturbation and long-chain polyunsaturated fatty acid (PUFA) supplementation, and evades retinol-mediated protection. Instead, WMK-1-induced cell death requires labile Fe", "abstract_zh": "铁死亡被视为多种癌症的弱点，但体内有效诱导铁死亡的方法有限。我们绕开靶向抗铁死亡蛋白GPX4与FSP1的传统策略，设计了脂质过氧化代谢启动子（MILPO），并开发出含四氧烷自由基生成基团与线粒体靶向基团的化合物WMK-1/2，作为全新的铁死亡诱导剂。WMK-1主要定位于线粒体，诱导局部脂质过氧化并损害氧化磷酸化。WMK-1诱导一种“线粒体铁死亡”亚通路，不以抑制GPX4为前提，可被亲脂性自由基捕获抗氧化剂挽救，但对ACSL4扰动与长链多不饱和脂肪酸补充不敏感，并可逃逸视黄醇介导的保护。相反，WMK-1诱导的细胞死亡需要不稳定的铁", "summary_zh": "设计线粒体靶向四氧烷类化合物WMK-1/2，开辟不依赖GPX4的“线粒体铁死亡”新亚通路用于肿瘤抑制。", "highlight": "开发绕开GPX4/FSP1的线粒体靶向铁死亡诱导剂，提出“mito-ferroptosis”新机制。"}, {"title": "Multi-omics atlas of chronic exercise", "title_zh": "慢性运动的多元组学图谱", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.044", "url": "https://doi.org/10.1016/j.cell.2026.09.044", "abstract": "Exercise reduces all-cause mortality, yet its molecular effects across organs, sexes, and circadian phases remain incompletely understood. We subjected mice to 8 weeks of voluntary wheel running and collected 22 tissues and plasma during active and inactive phases for bulk RNA sequencing, metabolomics, proteomics, and single-nucleus RNA and methylation sequencing. Exercise induced canonical fiber-type switching and widespread, tissue-specific remodeling, with the largest transcriptomic changes in skeletal muscle. Except for the hypothalamus, kidney, and lung, most tissues changed more during the active phase. Females showed broader transcriptional responses, with distinct downregulation. Pairing single-nucleus methylomes with transcriptomes resolved the cell types driving exercise-induced epigenetic remodeling-changes undetectable by bulk studies. These included coordinated gene-body demethylation and transcription that tracked with fiber-type switching in specific myonuclei. Cell-type-resolved methylation, including partially methylated domains characterized in muscle, revealed a strong, sex-biased epigenetic response to training. Machine learning identified conserved exercise signatures across mammalian species.", "abstract_zh": "运动可降低全因死亡率，但其跨器官、性别与昼夜时相的分子效应仍未被充分理解。我们让小鼠进行8周自愿跑轮运动，并在活动期与静息期采集22种组织与血浆，进行转录组、代谢组、蛋白组以及单核RNA与甲基化测序。运动诱导了经典的肌纤维类型转换及广泛的、组织特异的重塑，其中骨骼肌的转录组变化最大。除下丘脑、肾脏与肺外，多数组织在活动期变化更显著。雌性表现出更广泛的转录反应及独特的下调模式。将单核甲基组与转录组配对，解析出驱动运动诱导表观重塑的细胞类型——这些是整体水平研究无法检出的。其中包括与特定肌核中肌纤维类型转换相伴随的协调基因体去甲基化与转录。细胞类型分辨的甲基化（包括在肌肉中表征的部分甲基化域）揭示了强烈且具性别偏倚的训练表观反应。机器学习识别出了跨哺乳物种保守的运动特征。", "summary_zh": "构建小鼠慢性运动的多组织、多组学时空图谱，揭示活动期/雌性反应更强及细胞类型特异的表观遗传重塑。", "highlight": "绘制跨22种组织的运动多组学图谱，发现细胞类型特异、性别偏倚的表观遗传重塑与保守运动特征。"}, {"title": "An opioid efficacy switch for reversible optical control of analgesia", "title_zh": "用于可逆光控镇痛的阿片效能开关", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.042", "url": "https://doi.org/10.1016/j.cell.2026.09.042", "abstract": "The mu-opioid receptor (MOR) is a major target for pain treatment, but its effectiveness is limited by dangerous side effects. However, the systemic administration of opioids makes it difficult both to decipher their underlying mechanisms of action and to limit drug action to specific receptor subpopulations to isolate therapeutic effects from adverse effects. Here, we develop a reversibly photoswitchable morphinan agonist termed \"azo-morphine-3\" (AM-3) that interconverts from low to high efficacy in response to light to enable optical control of MOR signaling. Structural analysis of the low (\"trans\") and high (\"cis\") efficacy states of AM-3 bound to the MOR reveals distinct binding modes, with each state driving unique ligand, receptor, and G protein dynamics. In mice, AM-3 drives reversible and repeatable optical control of antinociception across pain models with a reduced side effect profile owing to its limited brain accumulation and its ability to be locally activated.", "abstract_zh": "μ-阿片受体（MOR）是镇痛的主要靶点，但其疗效受危险副作用限制。全身性给予阿片类药物既难以解析其作用机制，也难以将药物作用限定于特定受体亚群以分离疗效与不良反应。本研究开发了一种可逆光开关型吗啡喃激动剂“偶氮吗啡-3”（AM-3），可在光照射下于低效能与高效能之间互变，从而实现对MOR信号的光控。对结合MOR的低效能（“反式”）与高效能（“顺式”）AM-3状态的结构分析揭示了不同的结合模式，每种状态驱动独特的配体、受体与G蛋白动力学。在小鼠中，AM-3在多种疼痛模型中实现了可逆、可重复的光控镇痛，并因脑部蓄积有限且可局部激活而具有更低的副作用特征。", "summary_zh": "开发光控可切换效能的阿片激动剂AM-3，实现局部、可逆镇痛并降低全身副作用。", "highlight": "首创光控“阿片效能开关”AM-3，在保留镇痛的同时显著减少中枢副作用，为精准镇痛提供新范式。"}, {"title": "Functional diversification of the cephalopod proteome by RNA editing", "title_zh": "头足类通过RNA编辑实现蛋白质组的功能多样化", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.043", "url": "https://doi.org/10.1016/j.cell.2026.09.043", "abstract": "Coleoid cephalopods exhibit the highest levels of adenosine deaminases acting on RNA (ADAR)-mediated RNA editing of any known taxon, yet the functional consequences of most recoding events remain unclear. Here, we integrated proteomics with biochemical and cellular assays to characterize recoding across the Doryteuthis pealeii proteome. This confirmed the translation of 7,997 recoded sites at the protein level and revealed how recoding reshapes the proteome by altering protein stability, subcellular localization, post-translational modifications, and enzymatic activity. We find that recoding also creates or ablates post-translational modification sites, with direct effects on protein function and protein-protein interactions. Recoding the E3 ligase MARCHF5 drives widespread changes in substrate ubiquitylation and perturbs mitochondrial homeostasis, illustrating how RNA editing can influence organelle function. Together, these data give a proteome-scale view of how extensive RNA recoding diversifies protein function in coleoid cephalopods and offer a framework for understanding how RNA-level plasticity shapes protein function and cellular physiology.", "abstract_zh": "鞘亚纲头足类拥有所有已知类群中最高的ADAR介导RNA编辑水平，但大多数重编码事件的功能后果仍不清楚。本研究整合蛋白质组学与生化、细胞实验，刻画了长鳍枪乌贼蛋白质组中的重编码。这从蛋白水平确认了7,997个重编码位点的翻译，并揭示了重编码如何通过改变蛋白稳定性、亚细胞定位、翻译后修饰与酶活性来重塑蛋白质组。我们发现重编码还会创建或消除翻译后修饰位点，直接影响蛋白功能与蛋白-蛋白相互作用。对E3连接酶MARCHF5的重编码驱动了底物泛素化的广泛改变并扰动线粒体稳态，说明RNA编辑可影响细胞器功能。这些数据从蛋白质组尺度展示了广泛的RNA重编码如何使头足类蛋白功能多样化，并为理解RNA层面可塑性如何塑造蛋白功能与细胞生理提供了框架。", "summary_zh": "在蛋白质组水平确认近8千个RNA编辑重编码位点，揭示其通过改变稳定性、定位、修饰与酶活性来多样化蛋白功能。", "highlight": "首次在蛋白组尺度证实头足类RNA编辑广泛重编码蛋白功能，为RNA可塑性塑造生理提供框架。"}, {"title": "Cellular self-organization orchestrates ferroptosis propagation", "title_zh": "细胞自组织调控铁死亡的传播", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.039", "url": "https://doi.org/10.1016/j.cell.2026.09.039", "abstract": "Self-organization generates cellular patterns that guide morphogenesis, but how it regulates collective cell fate remains underexplored. We show that cellular self-organization constrains the propagation of ferroptosis, an iron-dependent form of oxidative cell death that can otherwise spread as unbounded trigger waves. The spatial patterning of cell density and alignment encodes transcriptional programs, priming cells toward ferroptosis-sensitive or -resistant fates. Low-density, misaligned regions with elevated YAP/TEAD1 activity are sensitive, whereas high-density, aligned regions with increased NRF2 expression form propagation-resistant boundaries. Cell elongation establishes a polarized distribution of oxidizable lipids, creating peroxidation hotspots at the cell poles that promote propagation along cell alignment. In silico and pharmacological perturbations reveal that pattern-dependent susceptibility and polarized lipid organization act together to constrain isotropic waves into spatially confined, anisotropic propagation. These findings identify self-organization as a systems-level mechanism governing collective homeostasis, providing a paradigm to explore how tissue-scale organization regulates cell death in development and disease.", "abstract_zh": "自组织产生指导形态发生的细胞模式，但它如何调控集体细胞命运仍鲜有探索。我们证明细胞自组织可限制铁死亡的传播——铁死亡是一种铁依赖的氧化性细胞死亡，否则会作为无界的触发波扩散。细胞密度与排列的空间模式编码了转录程序，使细胞倾向于铁死亡敏感或抵抗的命运。YAP/TEAD1活性升高的低密度、错向区域敏感，而NRF2表达增加的高密度、有序排列区域形成抵抗传播的边界。细胞伸长建立了可氧化脂质的极化分布，在细胞两极产生过氧化热点，促进沿细胞排列方向的传播。计算与药理学扰动表明，模式依赖的易感性与极化脂质组织共同将各向同性波约束为空间受限的各向异性传播。这些发现将自组织确定为调控集体稳态的系统级机制，为探索组织尺度组织如何调节发育与疾病中的细胞死亡提供了范式。", "summary_zh": "揭示细胞密度/排列的自组织模式通过YAP/NRF2与极性脂质分布决定铁死亡传播的时空边界。", "highlight": "发现细胞自组织作为系统级机制约束铁死亡传播，为组织尺度调控细胞死亡提供新范式。"}, {"title": "Spatiotemporal co-transcriptomics uncovers coordinated rhizobia-legume stress programs supporting nitrogen fixation in Medicago", "title_zh": "时空共转录组学揭示蒺藜苜蓿中协调根瘤菌—豆科胁迫程序以支持固氮", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.07.033", "url": "https://doi.org/10.1016/j.cell.2026.07.033", "abstract": "Rhizobial nitrogen fixation in legume nodules requires precise spatial and temporal coordination between host and bacterial gene expression. Here, we applied spatial enhanced resolution omics sequencing (Stereo-seq) to profile Medicago nodules across five developmental stages, generating a co-transcriptomic atlas of nodule development. Using a mixed-probe capture strategy, we simultaneously detected host and rhizobial transcripts within the same tissue sections, enabling analysis of host-microbe transcriptional coordination during symbiosis. We identified dynamic changes in host cell composition and developmental trajectories and uncovered two transcription factors, MtERF82 and MtDOF53, required for maintenance of the indeterminate nodule meristem. Rhizobial and host genes exhibited stage- and zone-specific expression patterns along the nodule apex-to-base axis. Notably, reactive oxygen species (ROS)-associated stress responses in both host cells and rhizobia were linked to symbiotic nitrogen fixation. Functional analyses further showed that MtERF71 and MtCBF1 promote nitrogen fixation by regulating ROS homeostasis and activating key symbiotic genes, highlighting stress signaling as an integral component of mutualistic symbiosis.", "abstract_zh": "根瘤中的根瘤菌固氮需要宿主与细菌基因表达之间精确的空间与时间协调。本研究应用空间高分辨率组学测序（Stereo-seq）对蒺藜苜蓿根瘤的五个发育阶段进行描绘，生成了根瘤发育的共转录组图谱。通过混合探针捕获策略，我们在同一组织切片中同时检测宿主与根瘤菌转录本，从而能够分析共生期间的宿主—微生物转录协调。我们鉴定了宿主细胞组成与发育轨迹的动态变化，并发现了维持无限型根瘤分生组织所需的两个转录因子MtERF82与MtDOF53。根瘤菌与宿主基因沿根瘤顶—基轴呈现阶段与区域特异的表达模式。值得注意的是，宿主细胞与根瘤菌中活性氧（ROS）相关的胁迫反应与共生固氮相关联。功能分析进一步显示，MtERF71与MtCBF1通过调控ROS稳态并激活关键共生基因来促进固氮，凸显胁迫信号作为互利共生的组成部分。", "summary_zh": "用空间转录组绘制豆科—根瘤菌共生发育图谱，发现ROS胁迫信号是协调固氮的关键整合组分。", "highlight": "空间共转录组揭示宿主—根瘤菌转录协调与ROS胁迫信号共同支撑共生固氮。"}, {"title": "A telomere-to-telomere map of somatic mutation burden and functional impact in a cancer", "title_zh": "癌症中体细胞的端粒到端粒突变负荷与功能影响图谱", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.033", "url": "https://doi.org/10.1016/j.cell.2026.09.033", "abstract": "Cancer genomes harbor extensive somatic genetic and epigenetic variation, yet large portions of the genome remain inaccessible to conventional reference-based analyses. Here, we demonstrate that pairing a near-telomere-to-telomere (near-T2T) diploid assembly of a donor with deep short- and long-read sequencing of their melanoma reveals that 16% of somatic variants localize to sequences absent from GRCh38, with satellite repeats acting as hotspots for UV-associated mutagenesis. Centromere kinetochore binding domains emerge as focal sites of chromosome arm aneuploidy breakpoints and somatic genetic variation, features we further demonstrate are also present in non-cancerous tissues. By contrast, extensive epigenetic remodeling of kinetochore binding domains appears specific to oncogenesis. Single-molecule telomere analyses reconstruct the cycle of telomere erosion and telomerase-mediated extension during tumor evolution, while haplotype-resolved chromatin maps reveal widespread somatic epimutations impacting regulatory elements. Together, these findings define previously inaccessible dimensions of somatic variation and establish a framework for telomere-to-telomere studies of human mosaicism.", "abstract_zh": "癌症基因组含有广泛的体细胞遗传与表观遗传变异，但基因组的很大一部分在传统基于参考序列的分析中仍不可及。本研究表明，将供体的近端粒到端粒（near-T2T）二倍体组装与其黑色素瘤的深度短读长与长读长测序配对，可揭示16%的体细胞变异定位于GRCh38缺失的序列中，其中卫星重复序列是UV相关诱变的 hotspots。着丝粒动粒结合域成为染色体臂非整倍体断点与体细胞遗传变异的聚集位点，我们进一步证明这些特征也存在于非癌组织中。相比之下，动粒结合域广泛的表观遗传重塑似乎特异于肿瘤发生。单分子端粒分析重建了肿瘤演化中端粒侵蚀与端粒酶介导延伸的循环，而单倍型分辨的染色质图谱揭示了影响调控元件的广泛体细胞表观突变。综上，这些发现定义了先前不可及的体细胞变异维度，并为人类嵌合体的端粒到端粒研究建立了框架。", "summary_zh": "结合near-T2T二倍体组装与深度测序，揭示传统参考基因组遗漏的16%体细胞变异及着丝粒区域变异特征。", "highlight": "以端粒到端粒组装打开此前不可及的体细胞变异维度，发现卫星重复与着丝粒域是突变/非整倍体热点。"}, {"title": "Somatic epimutations cap genetic determinism in the human diploid chromatin epigenome", "title_zh": "体细胞表观突变限制了人类二倍体染色质表观基因组中的遗传决定论", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.034", "url": "https://doi.org/10.1016/j.cell.2026.09.034", "abstract": "Diploid human cells contain two non-identical genomes, and differences in their regulation underlie human development and disease. We present Fiber-seq inferred regulatory elements (FIRE) and show that FIRE provides a more comprehensive and quantitative snapshot of the accessible chromatin landscape across the 6 Gbp diploid human genome, overcoming previously unrecognized biases in existing regulatory element catalogs. FIRE enables comprehensive detection of haplotype-selective chromatin accessibility (HSCA), exposing imprinted elements lacking underlying parent-of-origin differences in DNA methylation and gene regulatory modules that permit genes to escape X chromosome inactivation. We uncover that the human leukocyte antigen (HLA) locus harbors the most HSCA in immune cells, where we resolve specific transcription factor (TF) binding events disrupted by disease-associated variants. Finally, we demonstrate that the regulatory landscape of a cell is littered with autosomal somatic chromatin epimutations that are propagated by clonal expansions to create mitotically stable and non-genetically deterministic chromatin alterations.", "abstract_zh": "二倍体人类细胞含有两套非完全相同的基因组，其调控差异是人类发育与疾病的基础。我们提出Fiber-seq推断调控元件（FIRE），并证明FIRE提供了跨越6 Gbp二倍体人类基因组的、更全面且定量的可接近染色质景观快照，克服了现有调控元件目录中此前未被认识的偏差。FIRE能够全面检测单倍型选择性染色质可及性（HSCA），揭示缺乏亲本来源DNA甲基化差异的印记元件，以及允许基因逃逸X染色体失活的基因调控模块。我们发现人类白细胞抗原（HLA）位点在免疫细胞中具有最多的HSCA，并据此解析了被疾病相关变异破坏的特定转录因子结合事件。最后，我们证明细胞的调控景观中遍布常染色体体细胞染色质表观突变，这些表观突变通过克隆扩增传播，产生有丝分裂稳定且非遗传决定论的染色质改变。", "summary_zh": "开发FIRE技术全面描绘二倍体染色质可及性，揭示HSCA与克隆扩增传播的体细胞表观突变，挑战遗传决定论。", "highlight": "发现克隆扩增驱动的常染色体体细胞表观突变，表明细胞调控景观并非完全由遗传决定。"}, {"title": "Comprehensive benchmarking of somatic mutation detection by the SMaHT Network", "title_zh": "SMaHT网络对体细胞突变检测的系统性基准评测", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.037", "url": "https://doi.org/10.1016/j.cell.2026.09.037", "abstract": "Somatic mosaicism is increasingly recognized as a fundamental feature of human biology, yet the detection of somatic mutations remains challenging. The Somatic Mosaicism across Human Tissues (SMaHT) Network conducted large-scale benchmarking experiments involving cell lines and donor tissues to evaluate sequencing technologies, experimental approaches, and computational methods for detecting different types of somatic mutations, generating community resources with >1,000× short-read and 100-400× long-read data for nine analyzed samples. We determined effective strategies for utilizing short- and long-read sequencing for mutation detection and demonstrated that using donor-specific and pangenome-inferred diploid assemblies improved calling, extending mutation catalogs to challenging genomic regions. We benchmarked six duplex technologies and showed that single-cell sequencing resolves cell-type-specific mutational patterns and heterogeneity. Our results indicate that bulk, single-cell, and duplex analyses are complementary and that leveraging all three provides comprehensive characterization of mosaicism within tissues. Together, these findings provide the scientific and clinical communities with a roadmap for accurate genome-wide somatic mutation analysis.", "abstract_zh": "体细胞嵌合现象日益被认识为人类生物学的基本特征，但体细胞突变的检测仍具挑战性。体细胞嵌合跨人类组织（SMaHT）网络开展了涉及细胞系与供体组织的大规模基准实验，以评估测序技术、实验方案及计算方法对不同类型体细胞突变的检测能力，为九个分析样本生成了>1,000×短读长与100–400×长读长的社区资源。我们确定了利用短读长与长读长测序进行检测的有效策略，并证明使用供体特异与泛基因组推断的二倍体组装可改善变异检出，将突变目录扩展到困难基因组区域。我们对六种双链体（duplex）技术进行了基准评测，并表明单细胞测序可解析细胞类型特异的突变模式与异质性。结果表明，批量、单细胞与双链体分析互为补充，三者结合可对组织内嵌合现象进行全面刻画。这些发现为科学界与临床界提供了准确的全基因组体细胞突变分析路线图。", "summary_zh": "SMaHT网络系统基准评测多种测序与分析策略，证明批量+单细胞+双链体三联策略最全面地检测组织嵌合。", "highlight": "建立体细胞突变检测的标准路线图，提出三类分析互补以实现组织内嵌合的全面表征。"}, {"title": "Charting the silent variation within us", "title_zh": "绘制我们体内的“沉默变异”图谱", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.046", "url": "https://doi.org/10.1016/j.cell.2026.09.046", "abstract": "Every cell in the human body carries its own genome, shaped by mutations acquired over a lifetime, yet this vast somatic variation has been nearly impossible to measure. The SMaHT Network now delivers benchmarked tools and the first body-wide map of somatic mosaicism, establishing a baseline of \"normal\" against which its roles in development, aging, and disease can finally be tested.", "abstract_zh": "人体每个细胞都携带自身基因组，由一生中获得的突变塑造，然而这一庞大的体细胞变异几乎无法被测量。SMaHT网络现已交付经过基准验证的工具以及首张全身范围的体细胞嵌合图谱，建立起“正常”基线，使嵌合在发育、衰老与疾病中的作用终得检验。", "summary_zh": "述评SMaHT网络发布的首张全身体细胞嵌合图谱与基准工具，为研究嵌合建立“正常”基线。", "highlight": "SMaHT发布首张全身体细胞嵌合图谱，开启以“正常基线”检验嵌合与疾病关系的新时代。"}, {"title": "Cellular scaling laws in the mammalian brain", "title_zh": "哺乳动物大脑中的细胞规模法则", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.08.044", "url": "https://doi.org/10.1016/j.cell.2026.08.044", "abstract": "Recent whole-brain cell atlases have uncovered a consistent cytoarchitectural feature: the greatest diversity of discrete neuronal cell types resides not in the regions with the most neurons (e.g., the cortex and cerebellum) but rather in deep subcortical structures like the hypothalamus and brain stem. We propose that this discrepancy reflects a fundamental algorithmic division in the vertebrate brain between a \"learning subsystem\" and a \"steering subsystem.\" The learning subsystem (cortex, striatum, and cerebellum) scales via the replication of repetitive modules to maximize computational capacity, analogous to scaling up parameters in machine learning models. By contrast, the steering subsystem (hypothalamus, pallidum, and brainstem) scales via diversification of bespoke cell types to encode innate drives and reflexes, functioning as a high-dimensional biological \"reward function.\" This framework explains the divergence in how evolution has influenced these subsystems and offers a unified lens for understanding brain architecture and the etiology of brain disease; furthermore, it may inform model designs for artificial intelligence.", "abstract_zh": "近期全脑细胞图谱揭示了一致的细胞构筑特征：离散神经元类型多样性最高的区域并非神经元最多的区域（如皮层与小脑），而是下丘脑、脑干等深部皮下结构。我们提出，这一差异反映了脊椎动物大脑中“学习子系统”与“转向子系统”之间的根本算法分工。学习子系统（皮层、纹状体、小脑）通过重复模块的复制来扩展，以最大化计算能力，类似于机器学习模型中扩大参数规模。相反，转向子系统（下丘脑、苍白球、脑干）通过定制细胞类型的多样化来编码先天驱力与反射，充当高维的生物“奖励函数”。该框架解释了进化如何影响这两个子系统的差异，并为理解大脑架构与脑疾病病因提供了统一视角；此外，它还可能启发人工智能的模型设计。", "summary_zh": "提出大脑“学习/转向”双子系统规模法则，解释神经元多样性分布并为脑疾病与AI设计提供统一框架。", "highlight": "用“学习vs转向”双子系统框架解释大脑规模法则，连接进化、脑疾病与AI模型设计。"}, {"title": "Milking the niche: Microbial control of neonatal hematopoiesis", "title_zh": "榨取生态位：微生物对新生儿造血的控制", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.010", "url": "https://doi.org/10.1016/j.cell.2026.09.010", "abstract": "In this issue of Cell, Howard et al. reveal how the milk glycoprotein osteopontin shapes the neonatal microbiome to regulate hematopoiesis, promoting dendritic cell development and protection from severe respiratory infection. These findings uncover a maternal milk-microbiota pathway linking early-life nutrition to immune development and long-term disease susceptibility.", "abstract_zh": "在本期Cell中，Howard等人揭示了乳汁糖蛋白骨桥蛋白如何塑造新生儿微生物组以调控造血，促进树突状细胞发育并保护机体免受严重呼吸道感染。这些发现揭示了一条连接生命早期营养与免疫发育及长期疾病易感性的“母乳—微生物组”通路。", "summary_zh": "述评骨桥蛋白经微生物组调控新生儿造血与免疫发育的母乳通路。", "highlight": "揭示母乳骨桥蛋白—微生物组—造血轴，连接早期营养与长期免疫与疾病易感性。"}, {"title": "Immunoregulatory gene GIMAP6 suppresses lethal atherosclerotic vasculopathy and ischemic heart failure", "title_zh": "免疫调节基因GIMAP6抑制致死性动脉粥样硬化血管病变与缺血性心力衰竭", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.032", "url": "https://doi.org/10.1016/j.cell.2026.09.032", "abstract": "Controlling hyperlipidemia has reduced but not eliminated atherosclerotic cardiovascular disease (ASCVD) as a major cause of human mortality. Here, we report that loss of the immunoregulatory gene GTPase of immunity-associated protein 6 (Gimap6) in mice causes an inflammatory vasculopathy and accelerated atherosclerosis in the absence of hyperlipidemia. These vascular abnormalities cause progressive cardiac ischemia, myocardial infarction, and heart failure, culminating in early death. GIMAP6 loss precipitates early endothelial barrier failure and a mitochondrial reactive oxygen species (ROS)-PPARγ-CD36 lipid-influx cascade that lowers the foam-cell formation threshold and induces IL-6/MCP-1/TNF-mediated inflammation. Human hypomorphic GIMAP6 variants, including the African-ancestry-enriched V65I allele, are associated with altered monocyte redox balance, increased CD36-mediated lipid uptake, and early ASCVD. Thus, GIMAP6 is a crucial safeguard for vascular integrity that restrains endothelial dysfunction, macrophage foam cell generation, and inflammation that can cause lethal ASCVD independently of systemic hyperlipidemia.", "abstract_zh": "控制高脂血症已减少但未能消除动脉粥样硬化性心血管疾病（ASCVD）这一人类主要死因。本报告称，小鼠免疫调节基因GIMAP6缺失可在无高脂血症的情况下引起炎症性血管病变与加速的动脉粥样硬化。这些血管异常导致进行性心脏缺血、心肌梗死与心力衰竭，最终早期死亡。GIMAP6缺失引发早期内皮屏障失效及一条线粒体ROS—PPARγ—CD36脂质内流的级联反应，降低泡沫细胞形成阈值并诱导IL-6/MCP-1/TNF介导的炎症。人类GIMAP6低功能变异（包括非洲血统富集的V65I等位基因）与单核细胞氧化还原失衡、CD36介导脂质摄取增加及早发ASCVD相关。因此，GIMAP6是血管完整性的关键守护者，可在不依赖全身高脂血症的情况下抑制内皮功能障碍、巨噬细胞泡沫细胞生成与炎症，从而防止致死性ASCVD。", "summary_zh": "发现免疫调节基因GIMAP6缺失可在无高血脂下促发致死性动脉粥样硬化，提示其与人类早发ASCVD的遗传关联。", "highlight": "揭示GIMAP6作为血管完整性守护基因，独立于血脂异常抑制致命性动脉粥样硬化。"}, {"title": "Arabidopsis uses distinct coumarins and bacterial pathways for pH-adaptive iron acquisition", "title_zh": "拟南芥利用不同香豆素与细菌通路实现pH适应性铁获取", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.030", "url": "https://doi.org/10.1016/j.cell.2026.09.030", "abstract": "Iron (Fe) limitation restricts plant growth in diverse soils, and root-associated microbes can alleviate plant Fe starvation. Whether plants integrate the edaphic environment and microbial activities into their Fe uptake strategies remains unclear. We show that bacterium-mediated alleviation of Fe deficiency in Arabidopsis functions at varying environmental pH and is taxonomically widespread among root microbiota isolates from soils with different edaphic profiles. This process is regulated by host-controlled and pH-adapted root exudation of different coumarin chemotypes. These exometabolites interact with root-associated bacteria to mobilize Fe either via bacterial siderophore-mediated chelation at circumneutral pH or redox-sensing-controlled, reduction-based pathways at acidic pH. The corresponding bacterial genes are prevalent in the root microbiota, and they likely evolved before the emergence of land plants. Our findings suggest that Fe malnutrition-induced exudation of redox-active metabolites by non-graminaceous plant species is a widespread adaptation for Fe mobilization from soil, mediated by the co-option of ancient microbial processes.", "abstract_zh": "铁（Fe）限制制约植物在多种土壤中的生长，而根系相关微生物可缓解植物缺铁。植物是否将土壤环境与微生物活动整合进其铁摄取策略仍不清楚。我们表明，细菌介导的拟南芥缺铁缓解作用在不同环境pH下均存在，且在来自不同土壤剖面的根际微生物分离株中分类学上广泛存在。该过程受宿主控制、且pH适应的不同香豆素化学型根系分泌所调控。这些外代谢物与根际细菌互作，在中性的近中性pH下通过细菌铁载体介导的螯合、或在酸性pH下通过氧化还原感应控制的还原途径来动员铁。相应的细菌基因在根际微生物组中普遍存在的，且可能早于陆生植物出现之前就已演化。我们的发现提示，非禾本科植物在铁营养不良诱导下分泌氧化还原活性代谢物，是一种通过征用古老微生物过程从土壤动员铁的广泛适应。", "summary_zh": "揭示拟南芥依环境pH分泌不同香豆素、借助根际细菌双途径动员铁，为植物缺铁适应提供机制。", "highlight": "阐明植物pH适应性铁获取依赖宿主香豆素分泌与根际细菌协同，揭示古老微生物过程的征用。"}, {"title": "STING reprogramming by estrogen promotes neutrophil extracellular trap formation and sex-biased resistance to ADC therapy", "title_zh": "雌激素对STING的重编程促进中性粒细胞胞外诱捕网形成及性别偏倚的ADC治疗抵抗", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.031", "url": "https://doi.org/10.1016/j.cell.2026.09.031", "abstract": "Sex differences in cancer therapy response remain poorly understood. Using a \"phase II-like preclinical trial\" across 55 CLDN18.2", "abstract_zh": "癌症治疗反应的性别差异仍知之甚少。本研究利用跨越55个CLDN18.2的相关模型展开“类二期临床前试验”……（源数据摘要于此截断）", "summary_zh": "（摘要原文在源数据中被截断；题目显示其探讨雌激素重编程STING信号、促进NET形成并导致抗体偶联药物（ADC）疗效的性别差异。）", "highlight": "发现雌激素—STING轴造成癌症治疗反应的性别偏倚，影响ADC疗效。"}, {"title": "Resident tissue macrophages transfer selenium transporter protein to protect pancreatic cancer from ferroptosis", "title_zh": "组织驻留巨噬细胞转运硒转运蛋白以保护胰腺癌免遭铁死亡", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.09.001", "url": "https://doi.org/10.1016/j.cell.2026.09.001", "abstract": "Pancreatic ductal adenocarcinoma (PDAC), an aggressive cancer with a poor prognosis, contains resident tissue macrophages (RTMs) present before tumor onset and monocyte-derived macrophages recruited during tumor development, but their distinct roles in supporting tumor progression remain unclear. Combining single-cell profiling, spatial analysis, lineage tracing, RTM depletion, and selenium tracing, we found that RTMs preferentially localize at the tumor border, where they promote epithelial-mesenchymal transition (EMT), tumor growth, and metastasis. Mechanistically, RTMs transfer the selenium transporter Selenop to EMT", "abstract_zh": "胰腺导管腺癌（PDAC）是一种预后差的侵袭性癌症，含有肿瘤发生前即存在的组织驻留巨噬细胞（RTM）以及肿瘤发展过程中招募的单核细胞来源巨噬细胞，但二者在支持肿瘤进展中的不同作用仍不清楚。结合单细胞分析、空间分析、谱系追踪、RTM清除与硒示踪，我们发现RTM优先定位于肿瘤边界，在此促进上皮—间质转化（EMT）、肿瘤生长与转移。机制上，RTM将硒转运蛋白Selenop转运至EMT……（源数据摘要于此截断）", "summary_zh": "（摘要原文在源数据中被截断；题目与片段显示RTM在肿瘤边界通过转运硒转运蛋白Selenop促进EMT、生长与转移，并保护PDAC免遭铁死亡。）", "highlight": "揭示组织驻留巨噬细胞经Selenop硒转运保护胰腺癌抵抗铁死亡并促进进展。"}, {"title": "Switching of transcriptional control from interferon regulatory factor 2 to interferon regulatory factor 1 drives innate immune cell activation", "title_zh": "转录控制从IRF2切换到IRF1驱动固有免疫细胞活化", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.08.049", "url": "https://doi.org/10.1016/j.cell.2026.08.049", "abstract": "Interferon regulatory factor 2 (IRF2) is a transcription factor that prevents skin inflammation in mice and humans but, paradoxically, promotes pyroptosis by upregulating gasdermin D. How IRF2 activates some proinflammatory genes but suppresses inflammation is unclear. We show that skin inflammation in Irf2-deficient mice is driven by IRF1 activation of interferon-stimulated genes (ISGs). Chromatin profiling reveals that IRF1 and IRF2 occupy the same ISG regulatory sites, but as a weaker transcriptional activator, IRF2 limits ISG transcription by IRF1. Toll-like receptor (TLR) signaling favors IRF1-driven transcription by inducing Irf1. In addition, IRF1 recruits the ubiquitin ligase SPOP to ISG sites, resulting in proteasomal degradation of IRF2. This shift from IRF2 to IRF1 occupancy enhances ISG transcription. Collectively, these findings define a hierarchical transcriptional circuit in which IRF2 limits IRF1 activity under homeostatic conditions but is displaced during an immune response, allowing IRF1-dependent gene programs central to innate immunity and autoinflammation.", "abstract_zh": "干扰素调节因子2（IRF2）是一种在小鼠与人体中防止皮肤炎症的转录因子，但矛盾的是它又通过上调gasdermin D促进细胞焦亡。IRF2如何激活某些促炎基因却又抑制炎症尚不清楚。我们显示，Irf2缺陷小鼠的皮肤炎症由IRF1对干扰素刺激基因（ISG）的激活所驱动。染色质分析揭示IRF1与IRF2占据相同的ISG调控位点，但作为较弱的转录激活因子，IRF2限制了IRF1介导的ISG转录。Toll样受体（TLR）信号通过诱导Irf1而偏向IRF1驱动的转录。此外，IRF1在ISG位点招募泛素连接酶SPOP，导致IRF2的蛋白酶体降解。这种从IRF2到IRF1占据的切换增强了ISG转录。综上，这些发现定义了一个层级转录回路：稳态下IRF2限制IRF1活性，但在免疫应答中被置换，从而允许依赖于IRF1、对固有免疫与自身炎症至关重要的基因程序。", "summary_zh": "阐明IRF2在稳态下抑制IRF1、免疫应答时经SPOP降解被置换，从而解除IRF1驱动的ISG转录的层级回路。", "highlight": "揭示IRF2—IRF1层级开关调控固有免疫基因，解释IRF2缺陷致皮肤炎症的机制。"}, {"title": "Toward autonomous science with agentic artificial intelligence", "title_zh": "迈向具自主科学能力的智能体人工智能", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.08.052", "url": "https://doi.org/10.1016/j.cell.2026.08.052", "abstract": "Artificial intelligence (AI) in biomedicine has evolved from pattern-recognition for medical image analysis to generative models like AlphaFold that predict protein structures. Tools such as Elicit, GPT-Rosalind, and Claude Science now bridge prediction and reasoning through literature synthesis, domain-tuned models, and agentic workbenches. Three recent systems (Co-Scientist, Robin, and Biomni) demonstrated agentic AI capable of generating hypotheses, designing experiments, computational analysis, and refining reasoning through experimental feedback. This perspective traces the emergence of agentic scientific reasoning, discusses scaling laws and autonomous laboratories, and argues that AI's transformative potential is inseparable from challenges in hallucination, bias, irreproducibility, and dual use. Scientific progress will depend on responsible human-AI collaboration.", "abstract_zh": "生物医学中的人工智能已从医学影像分析的模式识别，演进到如AlphaFold这样预测蛋白质结构的生成模型。Elicit、GPT-Rosalind、Claude Science等工具现通过文献综合、领域微调模型与智能体工作台将预测与推理连接起来。三个近期系统（Co-Scientist、Robin、Biomni）展示了能够生成假设、设计实验、进行计算分析并通过实验反馈精炼推理的具自主科学能力的AI。本观点文章追溯自主科学推理的兴起，讨论规模法则与自主实验室，并主张AI的变革潜力与其在幻觉、偏见、不可复现与双重用途方面的挑战不可分割。科学进展将取决于负责任的人—AI协作。", "summary_zh": "评述自主科学AI（Co-Scientist/Robin/Biomni）的兴起，指出其潜力与幻觉、偏见、不可复现等挑战并存。", "highlight": "系统阐述具自主科学能力的AI范式，强调需负责任的人—AI协作以释放变革潜力。"}, {"title": "Ratiometric transcriptional activation by protein degradation", "title_zh": "通过蛋白降解实现的比例式转录激活", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.08.009", "url": "https://doi.org/10.1016/j.cell.2026.08.009", "abstract": "Cells can respond to alterations in the abundances of specific proteins through transcriptional outputs. Synthetic approaches inspired by native post-transcriptional circuits that convert protein abundance changes into programmable gene expression would be transformative. Here, we discover and describe design principles that effectively convert protein degradation into transcriptional outputs in live cells. We define ratiometric transcriptional activation, where control over the ratio between a transcription factor and a protein of interest fused to its inhibitor enables detection of abundance changes with high sensitivity at scale. We show that ratiometric transcriptional activation can be implemented in single cells using triply orthogonal circuits or in multicellular pools, operating independently of the mechanism of protein downregulation and enabling simultaneous detection of multiple protein downregulation events through outputs such as cell survival, fluorescent protein expression, or barcode sequencing. These circuits can be applied to oncogenic targets and enable discovery of new molecular glue degraders.", "abstract_zh": "细胞可通过转录输出响应特定蛋白丰度的改变。受天然转录后回路启发、将蛋白丰度变化转化为可编程基因表达的合称方法将具变革意义。本研究发现并描述了在活细胞中将蛋白降解有效转化为转录输出的设计原则。我们定义了比例式转录激活：通过控制转录因子与融合其抑制物的目标蛋白之间的比例，可大规模高灵敏地检测丰度变化。我们显示比例式转录激活可在单细胞中通过三重正交回路实现，也可在多细胞池中运作，且独立于蛋白下调机制，并能通过细胞存活、荧光蛋白表达或条形码测序等输出同时检测多个蛋白下调事件。这些回路可应用于致癌靶点，并助力发现新的分子胶降解剂。", "summary_zh": "提出“比例式转录激活”设计，将蛋白降解转化为灵敏、可并行的转录读数，可用于抗癌靶点与分子胶发现。", "highlight": "发明基于蛋白丰度比例的转录激活回路，开辟感知蛋白降解并筛选分子胶降解剂的新平台。"}, {"title": "Human nuclear ribomes reveal DNA-embedded ribonucleotides as epigenetic modulators of transcription-associated DNA supercoiling", "title_zh": "人类核内“核糖组”揭示嵌入DNA的核糖核苷酸是转录相关DNA超螺旋的表观调节因子", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.07.053", "url": "https://doi.org/10.1016/j.cell.2026.07.053", "abstract": "Ribonucleoside monophosphates (rNMPs) are the most abundant non-canonical nucleotides in DNA, yet their distribution and function in the human nuclear genome remain unclear. We present high-resolution maps of ∼1 million rNMPs per genome across diverse human cells, revealing a non-random nuclear \"ribome,\" the genome-wide landscape of embedded rNMPs, enriched in GC-rich regions, regulatory elements, and telomeres. Ribonucleotide-enriched zones (REZs) cluster near transcription start sites (TSSs), coincide with C-phosphate-G (CpG) islands, R-loops, and G4 structures, and scale with gene expression. Ribonuclease (RNase) H2 deficiency increases rGMP levels and is associated with topoisomerase 1 (Top1)-dependent, strand-biased rNMP enrichment near TSSs, while Top1 depletion further enhances rGMP accumulation. RNase H2-mediated nicking at rNMPs alters DNA supercoiling in vitro, and RNH2A-deficient cells show altered supercoiling at rNMP-enriched TSSs. Our findings identify embedded rNMPs as epigenetic modulators of DNA supercoiling linked to DNA sequence and transcription, revealing a connection between ribonucleotide processing and transcription-associated DNA topology in human cells.", "abstract_zh": "核糖核苷酸单磷酸（rNMP）是DNA中最丰富的非经典核苷酸，但其分布与功能在人类核基因组中仍不清楚。我们呈现了跨多种人类细胞、每基因组约100万个rNMP的高分辨率图谱，揭示了一个非随机的核内“核糖组”——即嵌入rNMP的全基因组景观，富集于GC丰富区、调控元件与端粒。核糖核苷酸富集区（REZ）聚集于转录起始位点（TSS）附近，与CpG岛、R环及G4结构重合，并随基因表达量而增强。核糖核酸酶H2（RNase H2）缺陷升高rGMP水平，并与拓扑异构酶1（Top1）依赖、链偏向的TSS附近rNMP富集相关；而Top1耗竭进一步增强rGMP积累。RNase H2在rNMP处的切割在体外改变DNA超螺旋，RNH2A缺陷细胞在rNMP富集的TSS处呈现改变的超螺旋。我们的发现将嵌入的rNMP鉴定为与DNA序列和转录相关的DNA超螺旋表观调节因子，揭示了人类细胞中核糖核苷酸处理与转录相关DNA拓扑之间的关联。", "summary_zh": "绘制人类核基因组rNMP“核糖组”图谱，证明嵌入DNA的核糖核苷酸经RNase H2/Top1调控转录相关超螺旋。", "highlight": "发现嵌入DNA的rNMP是DNA超螺旋的表观调节因子，连接核糖核苷酸处理与转录拓扑。"}, {"title": "Ancient genomes reveal distinct human dispersals and social stratification in the settlement history of western Remote Oceania", "title_zh": "古基因组揭示西大洋洲定居史中不同的人类扩散与社会分层", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.07.044", "url": "https://doi.org/10.1016/j.cell.2026.07.044", "abstract": "The settlement of western Remote Oceania involved interactions among deeply divergent populations. Initial settlement ∼3,000 years ago by Lapita-associated, Southeast Asian-related groups was followed by Papuan-related expansions and later sea voyages from Polynesia. We present genome-wide da
