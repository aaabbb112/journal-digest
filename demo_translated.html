ta spanning the past three millennia from the eastern Solomon Islands, Vanuatu, Fiji, and Tonga. We find that the Papuan-related expansion proceeded at a slower pace than the earlier Lapita-associated expansion and reached Fiji through at least two distinct human dispersals, centuries earlier than previously suggested. We provide direct evidence of Polynesian-related gene flow at around 1,000 years ago, giving rise to Polynesian Outlier communities in southern Vanuatu. Finally, we examine an early Fijian community, revealing social practices that preserved wealth/status within a biological kin group with elevated Southeast Asian-related ancestry. Our findings refine the settlement model of western Remote Oceania and highlight the complex interplay of past migrations and community structure.", "abstract_zh": "西大洋洲的定居涉及深度分化人群之间的互动。约3,000年前与Lapita文化相关、东南亚相关群体的初始定居之后，出现了巴布亚相关扩张以及后来来自波利尼西亚的远航。我们呈现了来自所罗门群岛东部、瓦努阿图、斐济与汤加、跨越过去三千年的全基因组数据。我们发现巴布亚相关扩张的步调慢于更早的Lapita相关扩张，并通过至少两次不同的人类扩散抵达斐济，比以往认为的早了数个世纪。我们提供了约1,000年前波利尼西亚相关基因流动的直接证据，造就了瓦努阿图南部的波利尼西亚离群社群。最后，我们考察了一个早期斐济社群，揭示了在具有较高东南亚相关祖先的生物亲属群体内保留财富/地位的社会实践。我们的发现细化了西大洋洲的定居模型，并凸显了历史迁徙与社群结构之间复杂的相互作用。", "summary_zh": "结合三千年古基因组，揭示西大洋洲多层人群扩散时序与社会分层，修正定居模型。", "highlight": "以古基因组细化西大洋洲定居史，发现巴布亚扩张更早、波利尼西亚基因流及亲属群体内地位传承。"}, {"title": "Metabolic atlas of early human cortex reveals glycolytic remodeling and pentose phosphate pathway control of cell fate transitions", "title_zh": "早期人类大脑皮层的代谢图谱揭示糖酵解重塑与磷酸戊糖通路对细胞命运转换的调控", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.07.023", "url": "https://doi.org/10.1016/j.cell.2026.07.023", "abstract": "Cortical development involves rapid progenitor expansion and cell diversification supported by tightly regulated metabolic programs, yet these programs remain largely uncharacterized in human development. Here, we generated a metabolic atlas of the early human cortex using primary tissue and stem cell-derived cortical organoids. We observed dynamic changes in core metabolic functions, including an unexpected increase in glycolysis and pentose phosphate pathway (PPP) activity during late neurogenesis. Manipulation of glucose availability in cortical organoids altered cell-type composition, increasing outer radial glia (oRG) and inhibitory neuron populations. Pharmacological and genetic inhibition of PPP enzymes recapitulated these cell fate changes. Ribose was sufficient to rescue radial glia (RG) gene expression changes, revert organoid cell-type composition, and restore levels of ATP and hypotaurine. These data identify a critical role for the PPP in modulating RG cell fate specification and generate a resource for future exploration of additional metabolic pathways in human cortical development.", "abstract_zh": "皮层发育涉及在严格调控的代谢程序支持下快速的祖细胞扩增与细胞多样化，但这些程序在人类发育中仍基本未被刻画。我们利用原代组织与干细胞来源的大脑皮层类器官生成了早期人类皮层的代谢图谱。我们观察到核心代谢功能的动态变化，包括在神经发生晚期糖酵解与磷酸戊糖通路（PPP）活性出乎意料地增强。在皮层类器官中操控葡萄糖可用性改变了细胞类型组成，增加了外层放射状胶质（oRG）与抑制性神经元群体。对PPP酶的药理与遗传抑制重现了这些细胞命运改变。核糖足以挽救放射状胶质（RG）基因表达变化、恢复类器官细胞类型组成，并恢复ATP与亚牛磺酸水平。这些数据确定了PPP在调控RG细胞命运特化中的关键作用，并为未来探索人类皮层发育中更多代谢通路提供了资源。", "summary_zh": "构建早期人脑皮层代谢图谱，发现晚期神经发生中糖酵解/PPP增强，且PPP通过核糖代谢决定RG命运。", "highlight": "揭示磷酸戊糖通路（PPP）以核糖代谢调控放射状胶质命运，为皮层发育代谢机制提供资源。"}, {"title": "Co-option of retrotransposons promotes antibody diversification", "title_zh": "转座子征用促进抗体多样化", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.07.021", "url": "https://doi.org/10.1016/j.cell.2026.07.021", "abstract": "Activation-induced cytidine deaminase (AID) accomplishes somatic hypermutation (SHM) of V", "abstract_zh": "激活诱导的胞苷脱氨酶（AID）实现V区的体细胞高频突变（SHM）……（源数据摘要于此截断）", "summary_zh": "（摘要原文在源数据中被截断，仅提供开头；题目显示其探讨逆转录转座子被征用以促进抗体多样化。）", "highlight": "揭示逆转录转座子被免疫系统征用以促进抗体多样化，拓展免疫多样生成机制。"}, {"title": "Milk osteopontin alters the infant microbiome to drive DC hematopoiesis and disease tolerance", "title_zh": "乳汁骨桥蛋白改变婴儿微生物组以驱动树突状细胞造血与疾病耐受", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.07.022", "url": "https://doi.org/10.1016/j.cell.2026.07.022", "abstract": "Breastfeeding reduces the risk of severe lower respiratory infections (sLRIs), a leading cause of infant mortality; however, the protective mechanisms remain elusive. Here, we demonstrated that the absence of milk-derived osteopontin (OPN), highly expressed in colostrum, predisposes neonatal mice to viral and bacterial sLRI, consequent to disrupted dendritic cell (DC) hematopoiesis in the developing liver and lung. Amelioration of disease severity by oral OPN supplementation was associated with increased enteric abundance of Lactobacillaceae and elevated levels of serum 3-phenyllactic acid (PLA), a peroxisome proliferator-activated receptor gamma (PPARγ) agonist. Supplementation with PLA or the PPARγ agonist rosiglitazone restored lung DC hematopoiesis via airway epithelium-derived chemokine ligand 25 (CCL25)-mediated recruitment of lymphoid-myeloid primed progenitors and induction of a supportive lung niche. PLA-induced DC hematopoiesis and disease tolerance were attenuated by plasmacytoid DC depletion, immunoneutralization of stem cell factor, or genetic deletion of airway epithelial Flt3L. Our findings elucidate a microbiome-host interaction by which milk OPN confers protection against sLRI.", "abstract_zh": "母乳喂养可降低严重下呼吸道感染（sLRI，婴儿死亡的主要原因）的风险，但其保护机制仍不清楚。本研究表明，初乳中高表达的乳汁来源骨桥蛋白（OPN）缺失会使新生小鼠易患病毒与细菌性sLRI，其原因是发育中肝与肺的树突状细胞（DC）造血受损。口服补充OPN减轻疾病严重程度，伴随肠道乳杆菌科丰度增加及血清3-苯基乳酸（PLA，一种PPARγ激动剂）水平升高。补充PLA或PPARγ激动剂罗格列酮，通过气道上皮来源的趋化因子配体25（CCL25）介导的淋巴—髓系前体祖细胞招募及支持性肺微环境诱导，恢复肺DC造血。PLA诱导的DC造血与疾病耐受可被浆细胞样DC清除、干细胞因子免疫中和或气道上皮Flt3L基因缺失所削弱。我们的发现阐明了一条乳汁OPN通过微生物组—宿主互作赋予sLRI保护的机制。", "summary_zh": "揭示乳汁OPN经乳杆菌—PLA—PPARγ轴恢复肺DC造血，从而保护婴儿抵御严重下呼吸道感染。", "highlight": "阐明乳汁骨桥蛋白—微生物组—PPARγ轴驱动DC造血与疾病耐受，解释母乳保护机制。"}, {"title": "CRISPR screens identify targets to rescue age-related T cell dysfunction in cancer", "title_zh": "CRISPR筛选鉴定可挽救老年相关T细胞功能障碍的靶点", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.07.016", "url": "https://doi.org/10.1016/j.cell.2026.07.016", "abstract": "Immune aging impairs T cell-mediated tumor control as well as cancer immunotherapy outcomes. The most important drivers of T cell dysfunction in aged tumors remain unknown. We performed single-cell CRISPR screens to identify Dusp5 and Zfp219 as key regulators of CD8", "abstract_zh": "免疫衰老损害T细胞介导的肿瘤控制以及癌症免疫治疗疗效。老年肿瘤中T细胞功能障碍的最重要驱动因素仍未知。我们进行了单细胞CRISPR筛选，鉴定出Dusp5与Zfp219是CD8……（源数据摘要于此截断）", "summary_zh": "（摘要原文在源数据中被截断，仅提供开头；题目显示其通过单细胞CRISPR筛选发现可挽救老年T细胞功能障碍的靶点。）", "highlight": "通过单细胞CRISPR筛选发现逆转老年T细胞功能障碍的靶点，有望改善老年免疫治疗。"}, {"title": "An Oryza orphan gene confers trans-species drought tolerance", "title_zh": "一个水稻孤儿基因赋予跨物种抗旱性", "journal": "Cell", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.cell.2026.07.005", "url": "https://doi.org/10.1016/j.cell.2026.07.005", "abstract": "Drought threatens crop productivity, yet enhancing tolerance often compromises yield. Abscisic acid (ABA) signaling is central to drought response, but its deep conservation can constrain adaptive flexibility. Here, we identify ROAD1 (rice orphan gene adapted for drought 1), an Oryza-specific orphan gene that confers robust drought tolerance without obvious growth defects under normal conditions. ROAD1 originated from Oryza meridionalis, and its functional allele, ROAD1", "abstract_zh": "干旱威胁作物产量，但增强耐受性常会牺牲产量。脱落酸（ABA）信号是干旱响应的核心，但其高度保守性可能限制适应灵活性。本研究鉴定出ROAD1（水稻抗旱孤儿基因1），一个稻属特有的孤儿基因，可在正常条件下不表现明显生长缺陷地赋予强抗旱性。ROAD1起源于南方稻，其功能等位基因ROAD1……（源数据摘要于此截断）", "summary_zh": "（摘要原文在源数据中被截断；题目与片段显示稻属特有孤儿基因ROAD1在不减产前提下赋予强抗旱性。）", "highlight": "发现稻属特有孤儿基因ROAD1，在不影响产量的情况下赋予水稻强抗旱性。"}, {"title": "The pyrin inflammasome senses OCTN2-mediated uptake of extracellular L-carnitine from muscle injury or ingestion", "title_zh": "pyrin炎症小体感知由OCTN2介导的、源于肌肉损伤或摄入的细胞外L-肉碱摄取", "journal": "Cell", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.cell.2026.09.015", "url": "https://doi.org/10.1016/j.cell.2026.09.015", "abstract": "Red-meat-containing diets are epidemiologically associated with diseases of chronic inflammation, while diets that restrict red meat improve health. Yet, it is uncertain how red meat incites inflammation. Here, we discover that L-carnitine, an amino acid highly concentrated in skeletal muscle myocytes, drives inflammasome activation in lipopolysaccharide (LPS)-challenged mice and LPS-primed murine and human macrophages. We find that extracellular L-carnitine represses mevalonate synthesis, thereby triggering activation of the pyrin inflammasome, downstream of cellular import by the high-affinity L-carnitine transporter OCTN2. We find that the inflammatory response to skeletal muscle injury also requires pyrin and OCTN2. Thus, in summary, we identify macrophages as sentinels of exogenous and endogenous extracellular L-carnitine that serve as a proxy for skeletal myocyte damage, and we open the field to examine the mechanistic basis for how excess dietary intake of carnitine-rich food drives inflammatory disease.", "abstract_zh": "含红肉的饮食在流行病学上与慢性炎症性疾病相关，而限制红肉的饮食可改善健康，但红肉如何引发炎症尚不清楚。本研究发现，在骨骼肌细胞中高度富集的氨基酸L-肉碱，可在LPS攻击小鼠及LPS预处理的鼠源和人源巨噬细胞中驱动炎症小体激活。细胞外L-肉碱通过高亲和力转运体OCTN2进入细胞后，抑制甲羟戊酸合成，从而触发pyrin炎症小体激活。骨骼肌损伤引发的炎症反应同样依赖pyrin与OCTN2。综上，本研究将巨噬细胞鉴定为外源与内源细胞外L-肉碱的“哨兵”，后者可作为骨骼肌细胞损伤的替代指标，并为探究过量摄入富肉碱食物如何驱动炎症性疾病提供了机制基础。", "summary_zh": "揭示红肉中的L-肉碱经OCTN2进入细胞、抑制甲羟戊酸合成并激活pyrin炎症小体，从而解释红肉促炎的机制。", "highlight": "首次阐明L-肉碱—OCTN2—pyrin炎症小体轴，为“红肉促炎”提供了具体的分子机制解释。"}, {"title": "A microbiome-bile acid axis mediates protection from chronic liver disease in females", "title_zh": "微生物组—胆汁酸轴介导女性对慢性肝病的保护", "journal": "Cell", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.cell.2026.09.048", "url": "https://doi.org/10.1016/j.cell.2026.09.048", "abstract": "Sex-based differences in chronic liver disease (CLD) incidence and progression are well documented, yet the mechanistic basis of this sexual disparity remains elusive. Here, leveraging a large-scale metabolomics database comprising 9,254 individuals, we identify the endogenous bile acid, isoursodeoxycholic acid (isoUDCA), as a candidate mediator of female-associated hepatoprotection. We trace the origin of isoUDCA to a bacterial consortium, which is selectively enriched by estrogen through shaping a specialized intestinal microenvironment. Mechanistically, isoUDCA promotes the nuclear accumulation of SREBP2. This upregulates the intracellular transporter STARD4 and its functionally coupled downstream enzyme CYP7B1, thereby facilitating intracellular cholesterol handling and metabolic conversion. Collectively, our findings support a microbiome-bile acid-liver axis that may contribute to sex differences in CLD susceptibility and support further evaluation of isoUDCA as a potential therapeutic intervention.", "abstract_zh": "慢性肝病（CLD）发病与进展的性别差异已有充分记载，但其机制基础仍不清楚。本研究利用包含9,254人的大规模代谢组数据库，鉴定出内源性胆汁酸异熊去氧胆酸（isoUDCA）是女性相关肝保护作用的候选介质。我们追溯isoUDCA的来源为一个被雌激素选择性富集的细菌组合，雌激素通过塑造特殊的肠道微环境实现这一富集。机制上，isoUDCA促进SREBP2的核积聚，上调胞内转运体STARD4及其功能偶联的下游酶CYP7B1，从而促进胞内胆固醇的处理与代谢转化。综上，本研究支持一条“微生物组—胆汁酸—肝脏”轴参与CLD易感性的性别差异，并为进一步评估isoUDCA作为潜在治疗干预手段提供依据。", "summary_zh": "发现雌激素富集的特定肠道菌群产生isoUDCA，经SREBP2—STARD4—CYP7B1轴改善胆固醇代谢，从而赋予女性肝病保护。", "highlight": "揭示肠道菌群来源胆汁酸isoUDCA是女性慢性肝病易感性较低的关键介质，具治疗转化潜力。"}, {"title": "Fabricated Protection? A Pilot Study Evaluating Ultraviolet Protection Claims in Sun-Protective Clothing", "title_zh": "制造的防护？一项评估防晒衣物紫外线防护宣称的试点研究", "journal": "JAAD", "date": "2026-10-14", "type": "Article", "doi": "10.1016/j.jaad.2026.10.023", "url": "https://doi.org/10.1016/j.jaad.2026.10.023", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：制造的防护？一项评估防晒衣物紫外线防护宣称的试点研究）", "highlight": "试点评估防晒衣物的紫外线防护宣称真实性，警示消费者。"}, {"title": "Dermatology images: Warts", "title_zh": "皮肤病图谱：疣", "journal": "JAAD", "date": "2026-10-14", "type": "Article", "doi": "10.1016/j.jaad.2026.09.131", "url": "https://doi.org/10.1016/j.jaad.2026.09.131", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：皮肤病图谱：疣）", "highlight": "JAAD的皮肤病图像栏目，以疣为例提供临床影像教学。"}, {"title": "Association Between Food Insecurity and Self-Reported Eczema/Skin Allergy in Adults: A Cross-Sectional Study Using 2012 and 2024 NHIS Data", "title_zh": "成人食物不安全与自我报告湿疹/皮肤过敏的关联：基于2012与2024 NHIS数据的横断面研究", "journal": "JAAD", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.jaad.2026.10.017", "url": "https://doi.org/10.1016/j.jaad.2026.10.017", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：成人食物不安全与自我报告湿疹/皮肤过敏的关联：基于2012与2024 NHIS数据的横断面研究）", "highlight": "基于全国调查数据分析食物不安全与成人湿疹/皮肤过敏报告的关联。"}, {"title": "Kaposi sarcoma during Janus kinase inhibition: A systematic review of an emerging safety signal", "title_zh": "Janus激酶抑制期间的卡波西肉瘤：一项针对新兴安全性信号的系统综述", "journal": "JAAD", "date": "2026-10-16", "type": "Article", "doi": "10.1016/j.jaad.2026.10.034", "url": "https://doi.org/10.1016/j.jaad.2026.10.034", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：Janus激酶抑制期间的卡波西肉瘤：一项针对新兴安全性信号的系统综述）", "highlight": "系统综述JAK抑制剂相关卡波西肉瘤病例，发出值得警惕的新兴安全性信号。"}, {"title": "Beyond JAAD - January 2027", "title_zh": "《JAAD之外》——2027年1月", "journal": "JAAD", "date": "2026-10-16", "type": "Article", "doi": "10.1016/j.jaad.2026.10.027", "url": "https://doi.org/10.1016/j.jaad.2026.10.027", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：《JAAD之外》——2027年1月）", "highlight": "JAAD期刊的“Beyond JAAD”月度导读栏目，汇总本月其他来源的重要皮肤病学进展。"}, {"title": "Efficacy and safety of litifilimab in cutaneous lupus erythematosus: 24-week results of the randomized phase 2 study, AMETHYST", "title_zh": "利非利单抗治疗皮肤型红斑狼疮的疗效与安全性：随机2期AMETHYST研究24周结果", "journal": "JAAD", "date": "2026-10-17", "type": "Article", "doi": "10.1016/j.jaad.2026.10.035", "url": "https://doi.org/10.1016/j.jaad.2026.10.035", "abstract": "Cutaneous lupus erythematosus (CLE) is a serious autoimmune disease with no approved targeted treatments. Evaluate the efficacy and safety of litifilimab in AMETHYST Part A (Phase 2). AMETHYST is a randomized, double-blind, placebo-controlled, Phase 2/3 study that investigates litifilimab in participants with CLE. Participants were randomized to receive litifilimab 225 mg or placebo every 4 weeks during Weeks 0-24. The primary endpoint was the Cutaneous Lupus Activity Investigator's Global Assessment-Revised (CLA-IGA-R) erythema score of 0-1 at Week 16, with several Cutaneous Lupus Erythematosus Disease Area and Severity Index (CLASI)-based endpoints at Week 24 as secondary endpoints. Safety was also assessed. Significantly more participants treated with litifilimab achieved clear/almost clear skin (CLA-IGA-R erythema 0-1) than those treated with placebo at Week 16 (14.7% vs 2.9%, P= .0263). Additionally, more participants treated with litifilimab achieved CLASI-70 response vs placebo at Week 24 (21.7% vs 5.8%, P = .0195). Litifilimab was generally well tolerated; safety data were consistent with prior studies. Study was not powered to detect statistically significant differences in secondary endpoints. Litifilimab treatment led to greater improvements in skin disease activity vs placebo and was well tolerated in participants with CLE through Week 24.", "abstract_zh": "皮肤型红斑狼疮（CLE）是一种严重的自身免疫病，目前无获批的靶向治疗。本研究（AMETHYST A部分，2期）评估利非利单抗的疗效与安全性。AMETHYST是一项随机、双盲、安慰剂对照的2/3期研究，在CLE受试者中考察利非利单抗。受试者在第0–24周每4周接受利非利单抗225 mg或安慰剂。主要终点为第16周皮肤狼疮活动研究者总体评估（CLA-IGA-R）红斑评分0–1，次要终点包括第24周多项CLASI评分。安全性同时评估。第16周时，利非利单抗组达到皮损清除/几乎清除（CLA-IGA-R 0–1）的比例显著高于安慰剂组（14.7% vs 2.9%，P=0.0263）；第24周时利非利单抗组CLASI-70应答率也更高（21.7% vs 5.8%，P=0.0195）。利非利单抗总体耐受性良好，安全性数据与既往研究一致。研究对次要终点未预设足够把握度。结果表明，至第24周利非利单抗较安慰剂显著改善皮肤疾病活动度且耐受性良好。", "summary_zh": "2期AMETHYST显示抗BDCA2抗体利非利单抗可改善CLE皮肤活动度且安全耐受，为首个潜在靶向疗法提供支持。", "highlight": "抗BDCA2首创药利非利单抗在CLE 2期达到主要终点，有望成为数十年来的首个CLE靶向治疗。"}, {"title": "Sequential 1550-nm fractional focal point technology and pulsed dye laser for port wine birthmarks: A referral center retrospective and survey study", "title_zh": "1550nm点阵焦点技术与脉冲染料激光序贯治疗葡萄酒色斑：转诊中心回顾性与调查性研究", "journal": "JAAD", "date": "2026-10-17", "type": "Article", "doi": "10.1016/j.jaad.2026.10.039", "url": "https://doi.org/10.1016/j.jaad.2026.10.039", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：1550nm点阵焦点技术与脉冲染料激光序贯治疗葡萄酒色斑：转诊中心回顾性与调查性研究）", "highlight": "评估1550nm点阵激光联合脉冲染料激光序贯方案治疗葡萄酒色斑的真实世界疗效。"}, {"title": "Week 4 response to abrocitinib predicts week 12 remission and correlates with glycolytic pathway modulation in moderate-to-severe atopic dermatitis", "title_zh": "阿布昔替尼第4周应答预测第12周缓解，并与中重度特应性皮炎糖酵解通路改变相关", "journal": "JAAD", "date": "2026-10-17", "type": "Article", "doi": "10.1016/j.jaad.2026.09.085", "url": "https://doi.org/10.1016/j.jaad.2026.09.085", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：阿布昔替尼第4周应答预测第12周缓解，并与中重度特应性皮炎糖酵解通路改变相关）", "highlight": "提出阿布昔替尼第4周早期应答可预测AD第12周缓解，并关联糖酵解通路作为潜在机制/生物标志物。"}, {"title": "Second-opinion pathology review prior to dermatologic surgery: Clinical treatment impact", "title_zh": "皮肤外科术前病理会诊复核的临床治疗影响", "journal": "JAAD", "date": "2026-10-17", "type": "Article", "doi": "10.1016/j.jaad.2026.09.081", "url": "https://doi.org/10.1016/j.jaad.2026.09.081", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：皮肤外科术前病理会诊复核的临床治疗影响）", "highlight": "评估术前病理会诊复核对皮肤外科手术方案改变的临床价值。"}, {"title": "Talquetamab and Tebentafusp Demonstrate Target-Specific Cutaneous Safety Signal Profiles in FAERS", "title_zh": "Talquetamab与Tebentafusp在FAERS中呈现靶点特异性的皮肤安全性信号特征", "journal": "JAAD", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.jaad.2026.10.050", "url": "https://doi.org/10.1016/j.jaad.2026.10.050", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：Talquetamab与Tebentafusp在FAERS中呈现靶点特异性的皮肤安全性信号特征）", "highlight": "利用真实世界药物安全数据库FAERS，刻画了talquetamab与tebentafusp的皮肤不良事件靶点特异性特征。"}, {"title": "Nail disorders in pediatric patients: Part 1. Clinical overview, diagnosis and management of physiological variants, and congenital, hereditary, and infectious etiologies", "title_zh": "儿童甲病（第一部分）：生理变异及先天性、遗传性与感染性病因的临床概览、诊断与管理", "journal": "JAAD", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.jaad.2026.10.031", "url": "https://doi.org/10.1016/j.jaad.2026.10.031", "abstract": "Nail disorders in children are relatively common and anxiety-provoking for families, yet frequently underrecognized in clinical practice. Many nail disorders in children require no treatment or are readably treatable; however, unfamiliarity may lead to unnecessary, inappropriate, or delayed treatment. In this part 1 of a 2-part continuing medical education series we review physiological variants and congenital, hereditary, and infectious nail disorders, and provide diagnostic and management tips for dermatologists managing these conditions.", "abstract_zh": "儿童甲病相对常见且常令家庭焦虑，但在临床实践中常被忽视。许多儿童甲病无需治疗或易于处理，然而因认识不足可能导致不必要、不恰当或延迟的治疗。在本两篇继续教育系列的第一部分中，我们综述了生理变异以及先天性、遗传性与感染性甲病，并为皮肤科医生管理这些疾病提供诊断与管理要点。", "summary_zh": "作为继续教育系列第一篇，系统梳理儿童甲病的生理变异及先天/遗传/感染性病因，强调提高识别率以避免误治。", "highlight": "针对儿童甲病临床低估问题，给出生理变异与先天/遗传/感染性甲病的诊断与管理实用要点。"}, {"title": "Psoriasis: Which therapy for which patient, updated, part I. Focus on Psoriasis Comorbidities and Preferred Systemic Agents", "title_zh": "银屑病：何种患者用何种治疗（更新版，第一部分）——聚焦银屑病共病与优选系统药物", "journal": "JAAD", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.jaad.2026.09.132", "url": "https://doi.org/10.1016/j.jaad.2026.09.132", "abstract": "Patients with psoriasis (PsO) may have various comorbidities, that are either related to or unrelated to the disease itself. Selection of the appropriate treatment modality has evolved substantially with the rapid expansion of available options that can be individualized based on patients' comorbidity profiles, extent of disease, prior therapeutic response, and treatment preferences. This first article of a two-part series focuses on selecting systemic therapy for PsO patients with specific inflammatory comorbidities or a history of malignancy.", "abstract_zh": "银屑病患者可能合并多种与该病相关或无关的疾病。随着可选方案的快速增多，可依据患者的共病谱、疾病范围、既往治疗反应及治疗偏好进行个体化选择，恰当治疗方式的选择已发生显著演变。本两篇系列的第一篇聚焦于为合并特定炎症性共病或有恶性肿瘤病史的银屑病患者选择系统治疗。", "summary_zh": "强调依据共病谱（炎症性疾病史、肿瘤史等）个体化选择银屑病系统药物，提供更新版用药思路。", "highlight": "提出按患者共病与肿瘤史个体化选择银屑病系统治疗的实用框架，更新了用药决策路径。"}, {"title": "Nail disorders in pediatric patients: Part 2. Clinical overview, diagnosis and management of inflammatory, pigmentary, and neoplastic etiologies", "title_zh": "儿童甲病（第二部分）：炎症性、色素性与肿瘤性病因的临床概览、诊断与管理", "journal": "JAAD", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.jaad.2026.10.032", "url": "https://doi.org/10.1016/j.jaad.2026.10.032", "abstract": "Nail disorders represent a relatively uncommon but diverse group of conditions seen in pediatric patients. Management varies largely by etiology. Some inflammatory nail disorders in children are self-limited, whereas others may lead to permanent nail loss if not recognized and treated early. In addition, certain nail disorders may present differently in children than adults and may suggest increased systemic disease burden. In Part 2 of this two-part continuing medical education series, we review inflammatory, pigmentary, and neoplastic nail disorders in children and propose clinical approach algorithms for pediatric nail psoriasis and longitudinal melanonychia.", "abstract_zh": "甲病在儿童中相对少见但病种多样，其处理很大程度上取决于病因。部分儿童炎症性甲病可自限，而另一些若未被早期识别和治疗可能导致永久性甲丢失。此外，某些甲病在儿童中的表现不同于成人，并可能提示系统性疾病负担增加。在本两篇继续教育系列的第二部分中，我们综述了儿童的炎症性、色素性与肿瘤性甲病，并提出了儿童甲银屑病与纵向黑甲病的临床处理算法。", "summary_zh": "作为系列第二篇，聚焦儿童炎症/色素/肿瘤性甲病，给出甲银屑病与纵向黑甲病的临床处理路径。", "highlight": "针对儿童甲病提供炎症、色素、肿瘤性病因的分型管理及处理算法，强调早诊早治以避免永久甲损。"}, {"title": "Postoperative Complications Following Malignant Skin Excision in Patients Using Glucagon-Like Peptide-1 Receptor Agonists: A 5-Year Retrospective Cohort Analysis Using TriNetX", "title_zh": "使用GLP-1受体激动剂的患者恶性皮肤切除术后并发症：基于TriNetX的5年回顾性队列分析", "journal": "JAAD", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.jaad.2026.10.046", "url": "https://doi.org/10.1016/j.jaad.2026.10.046", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：使用GLP-1受体激动剂的患者恶性皮肤切除术后并发症：基于TriNetX的5年回顾性队列分析）", "highlight": "基于5年真实世界队列，评估GLP-1受体激动剂使用与皮肤恶性肿瘤切除术后并发症的关联。"}, {"title": "Stimulants May Be a Culprit in Patients with both Erythromelalgia and Raynaud's phenomenon: A Retrospective Cohort Study", "title_zh": "兴奋剂可能是同时患红斑肢痛症与雷诺现象患者的诱因：一项回顾性队列研究", "journal": "JAAD", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.jaad.2026.10.045", "url": "https://doi.org/10.1016/j.jaad.2026.10.045", "abstract": "", "abstract_zh": "", "summary_zh": "（该文献来源未提供结构化摘要，以下仅基于题目概述：兴奋剂可能是同时患红斑肢痛症与雷诺现象患者的诱因：一项回顾性队列研究）", "highlight": "通过回顾性队列提示兴奋剂可能是红斑肢痛症合并雷诺现象的共同诱因，提示用药警示。"}, {"title": "Efficacy and safety of QY201, an oral dual Janus kinase 1/tyrosine kinase 2 inhibitor, in adults with moderate-to-severe atopic dermatitis: a multicenter, randomized, double-blind, placebo-controlled phase 2 dose-finding trial", "title_zh": "口服JAK1/TYK2双靶点抑制剂QY201治疗中重度特应性皮炎成人患者的2期剂量探索试验：多中心、随机、双盲、安慰剂对照", "journal": "JAAD", "date": "2026-10-20", "type": "Article", "doi": "10.1016/j.jaad.2026.10.044", "url": "https://doi.org/10.1016/j.jaad.2026.10.044", "abstract": "QY201 is a novel oral Janus kinase 1 and tyrosine kinase 2 inhibitor. To evaluate the efficacy of multiple QY201 doses in moderate-to-severe atopic dermatitis (AD), and to inform dose selection for phase 3 studies. In this phase 2, randomized, double-blind, placebo-controlled trial, 200 adults with moderate-to-severe AD were randomized 1:1:1:1 to receive QY201 (5 mg, 10 mg, or 20 mg twice daily [BID]) or placebo for 12 weeks. The primary endpoint was the proportion of patients achieving ≥75% improvement in Eczema Area and Severity Index (EASI-75) at week 12. EASI-75 response rates at week 12 were 72.9%, 84.7% and 81.4% in the 5 mg BID, 10 mg BID, and 20 mg BID groups, respectively, compared with 18.5% in the placebo group (all P<0.0001). Investigator's Global Assessment response rates were 44.7% (P=0.0011), 64.3% (P<0.0001), and 71.3% (P<0.0001), respectively, versus 12.4% with placebo. Treatment-emergent adverse events occurred in 74.0%, 75.5%, and 90.4% of patients receiving QY201, compared to 69.4% with placebo; most were mild or moderate. Short follow-up and single-country population. The phase 2 findings support further evaluation of QY201 at doses of 10 mg BID and 20 mg BID in confirmatory phase 3 trials.", "abstract_zh": "QY201是一种新型口服JAK1/TYK2双靶点抑制剂。本研究旨在评估其多个剂量对中重度特应性皮炎（AD）的疗效并为3期试验选量。在这项2期、随机、双盲、安慰剂对照试验中，200例中重度AD成人按1:1:1:1随机接受QY201（5 mg、10 mg或20 mg每日两次）或安慰剂治疗12周。主要终点为第12周达到EASI-75（湿疹面积严重程度指数改善≥75%）的患者比例。QY201 5 mg、10 mg、20 mg组的EASI-75应答率分别为72.9%、84.7%和81.4%，而安慰剂组为18.5%（均P<0.0001）。研究者总体评估应答率分别为44.7%、64.3%和71.3%，安慰剂组为12.4%。QY201组不良事件发生率74.0%、75.5%、90.4%，安慰剂组69.4%，多为轻中度。研究随访短且为单一国家人群。该2期结果支持在验证性3期试验中进一步评估10 mg与20 mg每日两次剂量。", "summary_zh": "QY201在2期试验中显著改善中重度AD，10 mg与20 mg每日两次剂量疗效突出且安全性可控，支持进入3期。", "highlight": "口服JAK1/TYK2双靶点抑制剂QY201在2期实现最高84.7%的EASI-75应答，疗效优于现有JAK抑制剂单靶点方案。"}, {"title": "Joint American Academy of Dermatology-Hidradenitis Suppurativa Foundation guidelines of care for the management of hidradenitis suppurativa", "title_zh": "美国皮肤科医师协会—化脓性汗腺炎基金会联合诊疗指南", "journal": "JAAD", "date": "2026-10-20", "type": "Article", "doi": "10.1016/j.jaad.2026.08.125", "url": "https://doi.org/10.1016/j.jaad.2026.08.125", "abstract": "Hidradenitis suppurativa affects 0.7% to 1.5% of the global population and causes substantial disability and meaningfully impairs quality of life. To provide evidence-based recommendations for the management of hidradenitis suppurativa. A workgroup conducted a systematic review and applied the Grading of Recommendations, Assessment, Development, and Evaluation approach to assess the certainty of evidence and to develop recommendations. This guideline presents 37 evidence-based recommendations. Strong recommendations are made for adalimumab, bimekizumab, infliximab, secukinumab, and routine pain assessment. Conditional recommendations are made for topical clindamycin, resorcinol, and ruxolitinib; oral doxycycline, tetracycline, and clindamycin with rifampin; intravenous ertapenem; spironolactone; short-term systemic corticosteroids; upadacitinib; specific procedural interventions; tobacco cessation; supportive pain management; and zinc supplementation and vitamin D repletion. Analysis is limited to best evidence available from systematic review. These guidelines provide evidence-based recommendations for the management of hidradenitis suppurativa.", "abstract_zh": "化脓性汗腺炎影响全球0.7%–1.5%的人口，造成显著残疾并严重损害生活质量。为提供基于证据的诊疗建议，工作组开展系统综述并采用GRADE方法评估证据确定性、制定推荐意见。本指南提出37条循证推荐：强推荐包括阿达木单抗、比美吉珠单抗、英夫利昔单抗、司库奇尤单抗以及常规疼痛评估；条件性推荐包括外用克林霉素、间苯二酚、鲁索替尼，口服多西环素、四环素及克林霉素联合利福平，静脉厄他培南，螺内酯，短期全身性糖皮质激素，乌帕替尼，特定外科操作，戒烟，支持性疼痛管理，以及补锌与补充维生素D。分析仅限于系统综述可得的最佳证据。本指南为化脓性汗腺炎的诊疗提供了循证推荐。", "summary_zh": "联合指南给出37条化脓性汗腺炎诊疗推荐，明确了生物制剂（如阿达木、比美吉珠等）的强推荐地位及多种条件性推荐方案。", "highlight": "发布37条循证推荐，首次将比美吉珠单抗、乌帕替尼等 newer 疗法纳入化脓性汗腺炎规范化诊疗。"}, {"title": "Endothelial AHR-APLNR signaling preserves vascular glycocalyx integrity and limits neutrophil-driven skin injury during local MRSA infection", "title_zh": "内皮AHR-APLNR信号维持血管糖萼完整并在局部MRSA感染中限制中性粒细胞驱动的皮肤损伤", "journal": "JID", "date": "2026-10-15", "type": "Article", "doi": "10.1016/j.jid.2026.09.858", "url": "https://doi.org/10.1016/j.jid.2026.09.858", "abstract": "Methicillin-resistant Staphylococcus aureus (MRSA) is a major cause of skin and soft tissue infection, yet the contribution of the cutaneous vasculature to host defense remains incompletely understood. Here, we identify endothelial aryl hydrocarbon receptor (AHR) signaling as a key regulator of vascular integrity and inflammatory responses during local MRSA skin infection. MRSA challenge reduced AHR expression in cutaneous endothelial cells in both human and murine skin. Endothelial-specific AHR deficiency exacerbated skin injury, increased bacterial burden, enhanced inflammatory cytokine production, and promoted neutrophil accumulation and activation. Mechanistically, AHR-deficient endothelial cells induced exaggerated neutrophil calcium signaling and prolonged neutrophil-endothelial interactions during transendothelial migration. Loss of endothelial AHR was further associated with glycocalyx thinning, widened endothelial junctions, and vascular leakage, indicating impaired vascular barrier function. Pharmacological AHR activation partially reversed these abnormalities. Transcriptomic and functional analyses revealed that endothelial AHR maintained apelin receptor (APLNR) expression, whereas pharmacological inhibition of APLNR reproduced several inflammatory and vascular features observed in AHR-deficient mice. Collectively, these findings identify an endothelial AHR-APLNR-glycocalyx pathway that preserves vascular barrier integrity and restrains maladaptive neutrophil activation during MRSA skin infection, highlighting a potential therapeutic target for bacterial skin disease.", "abstract_zh": "耐甲氧西林金黄色葡萄球菌（MRSA）是皮肤及软组织感染的主要原因，但皮肤血管系统对宿主防御的贡献仍不完全清楚。本研究确定内皮芳香烃受体（AHR）信号是局部MRSA皮肤感染期间血管完整性与炎症反应的关键调节者。MRSA攻击降低了人与小鼠皮肤中内皮细胞的AHR表达。内皮特异性AHR缺失加剧了皮肤损伤、增加细菌负荷、增强炎性细胞因子产生并促进中性粒细胞积聚与活化。机制上，AHR缺陷的内皮细胞在跨内皮迁移过程中诱导夸张的中性粒细胞钙信号及延长的中性粒细胞—内皮互作。内皮AHR缺失还与糖萼变薄、内皮连接增宽及血管渗漏相关，提示血管屏障功能受损。药物激活AHR可部分逆转这些异常。转录组与功能分析显示，内皮AHR维持apelin受体（APLNR）的表达，而药物抑制APLNR重现了AHR缺陷小鼠的若干炎症与血管特征。综上，这些发现确定了一条内皮AHR—APLNR—糖萼通路，可在MRSA皮肤感染期间维持血管屏障完整性并抑制适应不良的中性粒细胞活化，提示其为细菌性皮肤病潜在治疗靶点。", "summary_zh": "揭示内皮AHR经APLNR维持糖萼与血管屏障、抑制中性粒细胞过度活化，从而限制MRSA皮肤损伤的机制。", "highlight": "发现内皮AHR—APLNR—糖萼轴是宿主抵御MRSA皮肤感染、防止屏障破坏的关键通路。"}, {"title": "EGFR activity governs stage-dependent fibrotic responses in recessive dystrophic epidermolysis bullosa", "title_zh": "EGFR活性主导隐性营养不良型大疱性表皮松解症的阶段性纤维化反应", "journal": "JID", "date": "2026-10-16", "type": "Article", "doi": "10.1016/j.jid.2026.10.007", "url": "https://doi.org/10.1016/j.jid.2026.10.007", "abstract": "Repeated injury can impair transitions between cellular phenotypes, potentially leading to pathological tissue repair. In recessive dystrophic epidermolysis bullosa (RDEB), collagen VII deficiency predisposes to repeated tissue injury, driving inflammation and fibrosis. Although fibroblasts are major effector cells in RDEB fibrosis, their phenotypic and molecular changes underlying disease progression remain elusive. Through cellular and in situ analyses of clinical samples and tissue from an RDEB mouse model, we disclose a phenotypic switch in dermal fibroblasts during disease progression. At early stages, fibroblasts display a contractile phenotype, whereas at later stages they transition toward a less contractile phenotype with increased production of a fibrosis-promoting extracellular matrix, indicated by high tenascin-C levels. Dysregulated epidermal growth factor receptor (EGFR) signaling through AKT appears central to this switch. At early stages, EGFR signaling and AKT support fibroblast contractility, whereas at later stages this signaling becomes intrinsically blunted, with ADAM17 implicated in the transition. The type of inflammation modulates this phenotypic switch. Thus, RDEB fibroblasts transition from a contractile to a less contractile but pro-fibrotic phenotype during disease progression. These findings suggest that reducing cellular contractility may be advantageous at earlier disease stages, whereas extracellular matrix-targeting strategies may have higher priority at later stages.", "abstract_zh": "反复损伤可损害细胞表型之间的转换，可能导致病理性组织修复。在隐性营养不良型大疱性表皮松解症（RDEB）中，VII型胶原缺乏易导致反复组织损伤，进而驱动炎症与纤维化。尽管成纤维细胞是RDEB纤维化的主要效应细胞，但其驱动疾病进展的表型与分子改变仍不清楚。通过对临床样本及RDEB小鼠模型组织的细胞与原位分析，我们揭示了疾病进展过程中真皮成纤维细胞的一次表型转换：早期成纤维细胞呈收缩表型，而后期则转向收缩性减弱但促纤维化细胞外基质生成增加的状态（以tenascin-C高水平为标志）。通过AKT传导的EGFR信号失调似乎是这一转换的核心。早期EGFR—AKT信号支持成纤维细胞收缩性，后期该信号内在性减弱，ADAM17参与此转换。炎症类型可调节这一表型转换。因此，RDEB成纤维细胞在疾病进展中从收缩表型转为收缩减弱但促纤维化表型。这些发现提示，疾病早期降低细胞收缩性可能更有利，而后期应以靶向细胞外基质的策略为优先。", "summary_zh": "揭示RDEB成纤维细胞随病程从收缩表型转为促纤维化表型的EGFR—AKT依赖机制，提出分期治疗策略。", "highlight": "阐明RDEB纤维化的阶段性表型转换由EGFR—AKT信号驱动，为早/晚期分期精准干预提供依据。"}, {"title": "Vitiligo-associated variants and genes beyond immune-related loci: A genome-wide association and Mendelian randomization meta-analysis", "title_zh": "白癜风相关变异与非免疫位点之外的基因：全基因组关联与孟德尔随机化荟萃分析", "journal": "JID", "date": "2026-10-16", "type": "Article", "doi": "10.1016/j.jid.2026.09.859", "url": "https://doi.org/10.1016/j.jid.2026.09.859", "abstract": "Although past genome-wide association studies (GWAS) have identified over 50 susceptible loci associated with vitiligo risk, few have systematically explored causality among potentially associated variants and genes. To address this, we analyzed summary statistics from 3 large-scale genomic resources, including the Million Veteran Program, United Kingdom Biobank, and FinnGen. Cases were defined using ICD-9 code 709.01 or ICD-10 code L80, including all studies that contributed genome-wide summary statistics and limiting analyses to loci with ≥1 common variant (minor allele frequency ≥1%). METAL was used to conduct a fixed effects inverse variance-weighted meta-analysis with kinship adjustment. Variant-to-gene (V2G) mapping was performed using the Open Targets V2G framework. Potentially causal effects were assessed using two-sample Mendelian randomization (MR) and genome-wide significant protein and expression quantitative trait locus instruments across 16 datasets. Genome-wide significance was defined as P < 5 x 10", "abstract_zh": "尽管既往全基因组关联研究（GWAS）已发现50余个与白癜风风险相关的易感位点，但鲜有研究系统探索潜在相关变异与基因之间的因果关系。为此，我们分析了来自百万退伍军人计划、英国生物样本库和FinnGen等三大基因组资源的结果统计。病例以ICD-9编码709.01或ICD-10编码L80定义，纳入所有提供全基因组结果统计的研究，并将分析限定于含有≥1个常见变异（次要等位基因频率≥1%）的位点。采用METAL进行固定效应逆方差加权荟萃分析并校正亲缘关系。变异到基因（V2G）映射使用Open Targets V2G框架完成。潜在因果效应通过两样本孟德尔随机化（MR）及跨16个数据集的全基因组显著蛋白与表达数量性状位点工具变量进行评估。全基因组显著性定义为P<5×10", "summary_zh": "整合三大队列超大规模数据并辅以孟德尔随机化，系统评估白癜风易感变异与基因的因果关联。", "highlight": "通过孟德尔随机化在大规模多队列中界定白癜风易感位点的因果性，超越既往单纯相关性GWAS。"}, {"title": "Melatonin attenuates dermal fibroblast senescence with suppression of CXCL9-associated inflammatory signaling and mitochondrial stress", "title_zh": "褪黑素通过抑制CXCL9相关炎症信号与线粒体应激减轻真皮成纤维细胞衰老", "journal": "JID", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.jid.2026.10.009", "url": "https://doi.org/10.1016/j.jid.2026.10.009", "abstract": "Skin aging is driven by intrinsic and extrinsic factors that promote fibroblast senescence and dermal extracellular matrix degradation. Melatonin has potent antioxidant and anti-inflammatory activities. Here, we investigated the anti-aging effects of melatonin in human dermal fibroblasts and aged mouse skin, focusing on the pro-inflammatory chemokine CXCL9. Replicative-, irradiation-, and doxorubicin-induced senescence models of human dermal fibroblasts were used to assess the effects of melatonin. Melatonin significantly reduced the proportion of senescence-associated β-galactosidase-positive cells (38.5%-41.6%) and suppressed the expression of senescence markers, such as p16", "abstract_zh": "皮肤衰老由促进成纤维细胞衰老与真皮细胞外基质降解的内外因素驱动。褪黑素具有强抗氧化与抗炎活性。本研究以促炎趋化因子CXCL9为焦点，探讨褪黑素在人真皮成纤维细胞与老年小鼠皮肤中的抗衰老作用。研究采用复制性、辐照及多柔比星诱导的人真皮成纤维细胞衰老模型评估褪黑素效应。褪黑素显著降低了衰老相关β-半乳糖苷酶阳性细胞比例（38.5%–41.6%），并抑制p16等衰老标志物的表达。", "summary_zh": "证明褪黑素可延缓真皮成纤维细胞衰老，机制与抑制CXCL9炎症信号及缓解线粒体应激相关。", "highlight": "揭示褪黑素通过下调CXCL9炎症轴与减轻线粒体应激来抗衰老，为皮肤抗衰提供了新靶点。"}, {"title": "CD300f acts as an inducible inhibitory checkpoint that limits mast cell activation by suppressing MITF-dependent activation", "title_zh": "CD300f作为可诱导的抑制性检查点，通过抑制MITF依赖性活化来限制肥大细胞激活", "journal": "JID", "date": "2026-10-19", "type": "Article", "doi": "10.1016/j.jid.2026.10.010", "url": "https://doi.org/10.1016/j.jid.2026.10.010", "abstract": "Mast cells (MCs) are key regulators of cutaneous immune responses and play a central role in allergic and non-IgE-mediated skin inflammation by activating the Mas-related G protein-coupled receptor X2 (MRGPRX2). The inhibitory receptor CD300f has been shown to modulate MC activation, but its role in regulating MRGPRX2-dependent signaling remains unclear. Here, we investigated CD300f expression and function in human skin MCs and its impact on MRGPRX2-mediated responses, with some comparison to IgE-mediated responses. CD300f was expressed on human skin MCs, and its surface expression increased following MRGPRX2 activation. Engagement of CD300f significantly attenuated MC activation induced by MRGPRX2-dependent stimuli, including substance P, vancomycin, and quinolone drugs. Transcriptomic analyses in CD300f-LAD2 revealed that CD300f signaling suppressed activation-associated gene programs after substance P stimulation, including NF-κB and MAPK pathways. Notably, CD300f engagement markedly downregulated microphthalmia-associated transcription factor (MITF), as confirmed at the protein level in LAD2 and skin MCs. MITF inhibition with TT012 and CD300f triggering enhance inhibitory responses, decreasing MITF and MITF-target expression more strongly. Conversely, lysyl-tRNA synthetase overexpression increases MITF expression and significantly reduces CD300f-mediated inhibition of both MRGPRX2- and FcεRI-dependent signaling. These findings reveal a CD300f-MITF regulatory axis that limits skin MC activation and inflammatory responses.", "abstract_zh": "肥大细胞（MC）是皮肤免疫应答的关键调节者，并通过激活MRGPRX2在过敏及非IgE介导的皮肤炎症中起核心作用。抑制性受体CD300f已被证明可调节MC活化，但其在MRGPRX2依赖信号中的作用尚不清楚。本研究探讨了CD300f在人皮肤MC中的表达与功能及其对MRGPRX2介导反应的影响（并与IgE介导的反应作部分比较）。CD300f表达于人皮肤MC，且其表面表达在MRGPRX2激活后升高。CD300f参与显著减弱由MRGPRX2依赖刺激（包括P物质、万古霉素、喹诺酮类药物）诱导的MC活化。CD300f-LAD2的转录组分析显示，CD300f信号在P物质刺激后抑制包括NF-κB与MAPK通路在内的活化相关基因程序。值得注意的是，CD300f参与显著下调小眼畸形相关转录因子（MITF），并在蛋白水平得到验证。MITF抑制剂TT012与CD300f触发协同增强抑制反应，进一步降低MITF及其靶基因表达；反之，赖氨酰-tRNA合成酶过表达增加MITF表达并显著削弱CD300f对MRGPRX2与FcεRI依赖信号的抑制。这些发现揭示了一条限制皮肤MC活化与炎症反应的CD300f-MITF调控轴。", "summary_zh": "阐明CD300f在MRGPRX2激活后上调并下调MITF，从而负向调控肥大细胞活化，为皮肤炎症治疗提供检查点新靶点。", "highlight": "发现CD300f-MITF抑制轴可限制肥大细胞（尤其是MRGPRX2介导的）活化，提示新的抗过敏干预靶点。"}];

const main = document.getElementById('main');
const chipsEl = document.getElementById('chips');
const searchEl = document.getElementById('search');
const onlyArticleEl = document.getElementById('onlyArticle');
const RESEARCH = new Set(['Article','Research','Resource','Report']);
let activeJournal = 'ALL';

// 子标题
const weekLabel = META.weeks_back === 1 ? '近 1 周' : `近 ${META.weeks_back} 周`;
document.getElementById('subline').textContent =
  `更新时间 ${META.generated_at} · ${weekLabel} · 共 ${PAPERS.length} 篇 · 期刊 ${META.journals.length} 本`;

// 翻译状态
const tsEl = document.getElementById('tstatus');
if (META.translation === 'enabled') {
  tsEl.className = 'tstatus on';
  tsEl.textContent = '🔤 翻译：已启用 —— 题目 / 摘要 / 中文总结 / 关键突破已由通义千问生成';
} else {
  tsEl.className = 'tstatus off';
  tsEl.innerHTML = '🔤 翻译：未配置通义 Key —— 在 <b>config.json</b> 填入 TONGYI_API_KEY（或部署时设为 Secrets）后运行 <b>python translate.py</b>，即自动生成中文翻译 / 总结 / 关键突破';
}

// 构建期刊筛选
const journals = META.journals;
function countFor(j){ return j==='ALL' ? PAPERS.length : PAPERS.filter(p=>p.journal===j).length; }
function buildChips(){
  const all = [{name:'ALL',label:'全部'}].concat(journals.map(j=>({name:j,label:j})));
  chipsEl.innerHTML='';
  all.forEach(j=>{
    const c=document.createElement('span');
    c.className='chip'+(j.name===activeJournal?' active':'');
    c.innerHTML = (j.name==='ALL'?'全部':j.label) + '<span class="n">'+countFor(j.name)+'</span>';
    c.onclick=()=>{activeJournal=j.name;buildChips();render();};
    chipsEl.appendChild(c);
  });
}

function esc(s){ return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function card(p){
  const hasZh = p.title_zh || p.abstract_zh || p.summary_zh || p.highlight;
  const hl = p.highlight ? `<div class="hl">🔑 <b>关键突破：</b>${esc(p.highlight)}</div>` : '';
  const zhTitle = p.title_zh ? `<div class="title-zh">${esc(p.title_zh)}</div>` : '';
  const zhAbs = p.abstract_zh ? `<div class="ab"><span class="lbl">摘要·中译</span>${esc(p.abstract_zh)}</div>` : '';
  const sum = p.summary_zh ? `<div class="ab"><span class="lbl">中文摘要总结</span>${esc(p.summary_zh)}</div>` : '';
  const enAbs = p.abstract
    ? `<div class="ab"><span class="lbl">Abstract（英文摘要原文）</span>${esc(p.abstract)}</div>`
    : `<div class="ab noabs">（该期刊 RSS / 文献类型未提供摘要，无法提取）</div>`;
  const doiBtn = p.doi ? `<button class="btn" data-doi="${esc(p.doi)}">复制 DOI</button>` : '';
  const linkBtn = p.url ? `<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">原文链接</a>` : '';
  const zhHint = hasZh ? '' : `<div class="ab" style="color:var(--muted);font-size:12.5px">🔤 配置通义 Key 后自动生成中文翻译 / 总结 / 关键突破</div>`;
  return `<div class="card">
    <div class="meta">
      <span class="badge">${esc(p.journal)}</span>
      <span class="badge date">${esc(p.date)}</span>
      <span class="badge">${esc(p.type||'Article')}</span>
      ${hasZh?'<span class="badge ok">已翻译</span>':'<span class="badge warn">待翻译</span>'}
    </div>
    <div class="title-en">${esc(p.title)||'(无题目)'}</div>
    ${zhTitle}
    ${hl}
    <div class="abs-block">
      ${zhAbs}
      ${enAbs}
      ${sum}
    </div>
    ${zhHint}
    <div class="row">${doiBtn}${linkBtn}</div>
  </div>`;
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const onlyArt = onlyArticleEl.checked;
  const groups = {};
  PAPERS.forEach(p=>{
    if(activeJournal!=='ALL' && p.journal!==activeJournal) return;
    if(onlyArt && p.type && !RESEARCH.has(p.type)) return;
    if(q){
      const hay = (p.title+' '+p.title_zh+' '+p.abstract+' '+p.abstract_zh+' '+p.summary_zh+' '+p.highlight).toLowerCase();
      if(!hay.includes(q)) return;
    }
    (groups[p.journal] = groups[p.journal]||[]).push(p);
  });
  let html='';
  const order = META.journals.filter(j=>groups[j]);
  if(!order.length){ html = '<div class="empty">没有匹配的文献。</div>'; }
  order.forEach(j=>{
    html += `<div class="journal-h">${esc(j)}<span class="cnt">${groups[j].length} 篇</span></div>`;
    groups[j].forEach(p=> html += card(p));
  });
  main.innerHTML = html;
  main.querySelectorAll('button[data-doi]').forEach(b=>{
    b.onclick=()=>{ navigator.clipboard.writeText(b.dataset.doi).then(()=>{ b.textContent='已复制 ✓'; setTimeout(()=>b.textContent='复制 DOI',1500);}); };
  });
}

searchEl.addEventListener('input', render);
onlyArticleEl.addEventListener('change', render);
buildChips();
render();
</script>
</body>
</html>
